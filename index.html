<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Candinho - Artista Amigo</title>
<style>
    /* MANTENHA O SEU CSS IGUAL (O estilo está perfeito) */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: white; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 850px; background: rgba(22, 33, 62, 0.95); backdrop-filter: blur(10px); border-radius: 28px; padding: 28px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); border: 1px solid rgba(255, 215, 0, 0.3); }
    .header { display: flex; align-items: center; gap: 20px; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #e94560; }
    .avatar { width: 85px; height: 85px; border-radius: 50%; object-fit: cover; border: 3px solid #ffd700; animation: float 3s ease-in-out infinite; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
    .title h1 { font-size: 2rem; margin-bottom: 6px; letter-spacing: 1px; }
    .title small { font-size: 0.9rem; color: #ffd700; font-style: italic; }
    #chat { height: 460px; overflow-y: auto; background: rgba(15, 52, 96, 0.6); padding: 18px; border-radius: 18px; margin-bottom: 18px; border: 1px solid #1b262c; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 80%; padding: 10px 16px; border-radius: 22px; word-wrap: break-word; animation: fadeIn 0.2s ease; font-size: 0.95rem; }
    .user { background: #74b9ff; align-self: flex-end; color: #1e272e; border-bottom-right-radius: 6px; }
    .bot { background: #6c5ce7; align-self: flex-start; border-bottom-left-radius: 6px; color: white; }
    .bot-message-wrapper { display: flex; align-items: center; gap: 10px; }
    .bot-icon { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .bot-text { white-space: pre-wrap; flex: 1; }
    .bot-image { margin-top: 12px; max-width: 100%; width: auto; border-radius: 16px; cursor: zoom-in; transition: transform 0.2s ease; box-shadow: 0 2px 8px rgba(0,0,0,0.2); display: block; }
    .google-arts-btn { display: inline-block; margin-top: 12px; padding: 8px 15px; background: rgba(255, 215, 0, 0.15); border: 1px solid #ffd700; color: #ffd700; text-decoration: none; border-radius: 12px; font-size: 0.85rem; font-weight: bold; transition: all 0.2s; text-align: center; }
    .google-arts-btn:hover { background: #ffd700; color: #1a1a2e; transform: translateY(-2px); }
    .image-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10000; justify-content: center; align-items: center; }
    .image-modal img { max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 12px; }
    .loading { background: #dfe6e9; font-style: italic; animation: pulse 1s infinite; color: #1e272e; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0% { opacity: 0.6; } 100% { opacity: 1; } }
    .input-area { display: flex; gap: 12px; margin-top: 5px; }
    input { flex: 1; padding: 12px 18px; border: 2px solid #e94560; border-radius: 50px; font-size: 1rem; outline: none; background: rgba(255,255,255,0.1); color: white; }
    button { background: #e94560; border: none; padding: 0 28px; border-radius: 50px; color: white; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.5; }
    #chat::-webkit-scrollbar { width: 6px; }
    #chat::-webkit-scrollbar-thumb { background: #e94560; border-radius: 10px; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <img src="https://i.imgur.com/fnMYS0Z.png" alt="Candinho" class="avatar">
        <div class="title">
            <h1>Candinho</h1>
            <small>Seu amigo artista</small>
        </div>
    </div>
    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="pergunta" placeholder="Ex: Quem foi Tarsila?" autocomplete="off" autofocus>
        <button id="sendBtn">Enviar</button>
    </div>
</div>

<div id="imageModal" class="image-modal" onclick="closeImageModal()">
    <img id="modalImage" src="" alt="">
    <div class="modal-caption" id="modalCaption" style="position:absolute; bottom:20px; color:white; text-align:center; width:100%;"></div>
</div>

<script>
const chatDiv = document.getElementById("chat");
const inputField = document.getElementById("pergunta");
const sendBtn = document.getElementById("sendBtn");

function openImageModal(imgSrc, caption) {
    const modal = document.getElementById("imageModal");
    const modalImg = document.getElementById("modalImage");
    document.getElementById("modalCaption").innerText = caption;
    modalImg.src = imgSrc;
    modal.style.display = "flex";
}

function closeImageModal() {
    document.getElementById("imageModal").style.display = "none";
}

function addMessageToUI(text, isUser, imageData = null, googleArtsData = null) {
    const div = document.createElement("div");
    div.className = `msg ${isUser ? "user" : "bot"}`;

    if (isUser) {
        div.innerText = text;
    } else {
        const wrapper = document.createElement("div");
        wrapper.className = "bot-message-wrapper";
        const icon = document.createElement("img");
        icon.src = "https://i.imgur.com/UDl1c5j.png";
        icon.className = "bot-icon";
        const textSpan = document.createElement("span");
        textSpan.className = "bot-text";
        textSpan.innerText = text;
        wrapper.appendChild(icon);
        wrapper.appendChild(textSpan);
        div.appendChild(wrapper);
    }

    if (imageData && imageData.imagemUrl) {
        const img = document.createElement("img");
        img.src = imageData.imagemUrl;
        img.className = "bot-image";
        img.onclick = () => openImageModal(imageData.imagemUrl, imageData.titulo);
        div.appendChild(img);
        
        const credit = document.createElement("div");
        credit.style.fontSize = "0.6rem";
        credit.style.marginTop = "5px";
        credit.innerText = `📷 ${imageData.credito || "Fonte Aberta"}`;
        div.appendChild(credit);
    }

    if (googleArtsData && googleArtsData.url) {
        const btn = document.createElement("a");
        btn.href = googleArtsData.url;
        btn.target = "_blank";
        btn.className = "google-arts-btn";
        btn.innerText = "✨ Ver no Google Arts & Culture";
        div.appendChild(btn);
    }

    chatDiv.appendChild(div);
    chatDiv.scrollTop = chatDiv.scrollHeight;
}

let isProcessing = false;

async function enviar() {
    const texto = inputField.value.trim();
    if (!texto || isProcessing) return;

    try {
        isProcessing = true;
        sendBtn.disabled = true;
        inputField.disabled = true;

        addMessageToUI(texto, true);
        inputField.value = "";

        // Efeito de loading
        const loading = document.createElement("div");
        loading.className = "msg bot loading";
        loading.id = "tmp-loading";
        loading.innerText = "Candinho está pintando a resposta...";
        chatDiv.appendChild(loading);
        chatDiv.scrollTop = chatDiv.scrollHeight;

        const response = await fetch("/api/groq", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mensagem: texto })
        });

        const data = await response.json();
        
        document.getElementById("tmp-loading").remove();
        addMessageToUI(data.reply, false, data.image, data.googleArts);

    } catch (err) {
        console.error(err);
        if(document.getElementById("tmp-loading")) document.getElementById("tmp-loading").remove();
        addMessageToUI("Ops! Minhas tintas secaram. Pode repetir? 🎨", false);
    } finally {
        isProcessing = false;
        sendBtn.disabled = false;
        inputField.disabled = false;
        inputField.focus();
    }
}

sendBtn.onclick = enviar;
inputField.onkeydown = (e) => { if (e.key === "Enter") enviar(); };

addMessageToUI("Olá! Sou o Candinho, seu amigo artista. O que vamos descobrir hoje? 🎨", false);
</script>
</body>
</html>
