<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Candinho</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #ffeaa7, #81ecec);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
    }
    .container {
        max-width: 800px;
        width: 100%;
        background: white;
        border-radius: 35px;
        box-shadow: 0 20px 35px rgba(0,0,0,0.2);
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }
    .header {
        background: #6c5ce7;
        color: white;
        padding: 20px;
        text-align: center;
    }
    .avatar {
        width: 80px;
        border-radius: 50%;
        border: 3px solid #f9b713;
        margin-bottom: 10px;
    }
    .header h2 {
        margin: 0;
        font-size: 1.6rem;
    }
    #status {
        font-size: 0.8rem;
        margin-top: 5px;
        opacity: 0.9;
    }
    #chat {
        height: 400px;
        overflow-y: auto;
        background: #f8f9fa;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .msg {
        max-width: 80%;
        padding: 10px 15px;
        border-radius: 20px;
        line-height: 1.4;
        word-wrap: break-word;
        animation: fadeIn 0.2s ease;
    }
    .user {
        background: #74b9ff;
        align-self: flex-end;
        color: #000;
        border-bottom-right-radius: 5px;
    }
    .bot {
        background: #55efc4;
        align-self: flex-start;
        border-bottom-left-radius: 5px;
    }
    .error {
        background: #ffcccc;
        align-self: flex-start;
        border-left: 4px solid #ff0000;
    }
    .loading {
        background: #dfe6e9;
        font-style: italic;
        animation: pulse 1s infinite;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0% { opacity: 0.6; } 100% { opacity: 1; } }
    .input-area {
        display: flex;
        padding: 15px;
        background: white;
        border-top: 1px solid #ddd;
        gap: 10px;
    }
    input {
        flex: 1;
        padding: 12px 18px;
        border: 2px solid #6c5ce7;
        border-radius: 50px;
        font-size: 1rem;
        outline: none;
    }
    button {
        background: #fd79a8;
        border: none;
        padding: 0 20px;
        border-radius: 50px;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }
    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
    .image-msg {
        display: flex;
        flex-direction: column;
        gap: 5px;
    }
    .image-msg img {
        max-width: 250px;
        border-radius: 15px;
        margin-top: 5px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .image-caption {
        font-size: 0.8rem;
        color: #2d3436;
        margin-top: 5px;
    }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <img src="https://i.imgur.com/fnMYS0Z.png" alt="Candinho" class="avatar">
        <h2>Candinho 🎨</h2>
        <div id="status">🔄 Carregando conhecimentos...</div>
    </div>
    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="pergunta" placeholder="Pergunte sobre arte, dança, história ou peça uma piada..." autocomplete="off">
        <button id="sendBtn">Enviar</button>
    </div>
</div>

<script type="module">
    // ======================= CONFIGURAÇÕES =======================
    const GITHUB_BASE = "https://raw.githubusercontent.com/lenilsonxavier-dev/Candinho2.0/main/data/";
    const jsonFiles = {
        apoio_emocional: "apoio_emocional.json",
        arte_tecnicas: "arte_tecnicas.json",
        artes_visuais: "artes_visuais.json",
        artistas: "artistas.json",
        artistas_indigenas_afrobrasileiros: "artistas-indigenas-afrobrasileiros.json",
        artistas_mulheres_historicas: "artistas-mulheres-historicas.json",
        artistas_universais: "artistas_universais.json",
        atividades_artisticas: "atividades_artisticas.json",
        cantigas_de_roda: "cantigas_de_roda.json",
        cultura_afro_brasileira: "cultura_afro_brasileira.json",
        cultura_brasileira: "cultura_brasileira.json",
        cultura_indigena: "cultura_indigena.json",
        curiosidades: "curiosidades.json",
        dancas: "dancas.json",
        escritoras_negras_indigenas_brasileiras: "escritoras-negras-indigenas-brasileiras.json",
        escritores_negros_indigenas_brasileiros: "escritores-negros-indigenas-brasileiros.json",
        festas_brasileiras: "festas_brasileiras.json",
        folclore: "folclore.json",
        historia_arte: "historia_arte.json",
        imaginacao_infantil: "imaginacao_infantil.json",
        literatura_conceitos: "literatura_conceitos.json",
        lugares_arte: "lugares_arte.json",
        musica: "musica.json",
        obras_famosas_mundo: "obras-famosas-mundo.json",
        obras_modernistas_brasileiras: "obras-modernistas-brasileiras.json",
        perguntas_infantis: "perguntas_infantis.json",
        personagens_fantasticos: "personagens_fantasticos.json",
        piadas: "piadas.json",
        ritmos_musicais: "ritmos_musicais.json",
        saudacoes: "saudacoes.json",
        teatro: "teatro.json"
    };
    
    let dataStore = {};
    let ultimoPersonagem = null;
    let historicoMensagens = [];
    let nomeUsuario = localStorage.getItem("candinho_nome") || "";
    let conversaId = localStorage.getItem("candinho_conversaId");
    if (!conversaId) {
        conversaId = `sessao_${Date.now()}`;
        localStorage.setItem("candinho_conversaId", conversaId);
    }
    let memoria = {
        nome: localStorage.getItem("candinho_nome") || "",
        idade: localStorage.getItem("candinho_idade") || "",
        interesses: JSON.parse(localStorage.getItem("candinho_interesses") || "[]"),
        nivel: localStorage.getItem("candinho_nivel") || "iniciante",
        historicoCurto: []
    };
    
    let globalPlayerName = memoria.nome;
    
    const chatDiv = document.getElementById("chat");
    const inputField = document.getElementById("pergunta");
    const sendBtn = document.getElementById("sendBtn");
    const statusDiv = document.getElementById("status");
    
    function addMessageToUI(text, isUser, isError = false) {
        const div = document.createElement("div");
        div.className = `msg ${isUser ? "user" : "bot"} ${isError ? "error" : ""}`;
        div.innerText = text;
        chatDiv.appendChild(div);
        chatDiv.scrollTop = chatDiv.scrollHeight;
        return div;
    }
    
    function addImageToUI(imageUrl, titulo, credito) {
        const div = document.createElement("div");
        div.className = "msg bot image-msg";
        div.innerHTML = `
            <div>🎨 <strong>${titulo}</strong></div>
            <img src="${imageUrl}" alt="${titulo}" onerror="this.style.display='none'">
            <div class="image-caption">📷 Fonte: ${credito}</div>
        `;
        chatDiv.appendChild(div);
        chatDiv.scrollTop = chatDiv.scrollHeight;
    }
    
    function extrairMemoria(pergunta) {
        const texto = pergunta.toLowerCase();
        const nomeMatch = pergunta.match(/(?:meu nome é|sou|chamo(-me)?|chamado de) ([A-Za-zÀ-ÖØ-öø-ÿ]+)/i);
        if (nomeMatch && nomeMatch[2]) {
            let novoNome = nomeMatch[2].trim();
            novoNome = novoNome.charAt(0).toUpperCase() + novoNome.slice(1).toLowerCase();
            memoria.nome = novoNome;
            localStorage.setItem("candinho_nome", memoria.nome);
            globalPlayerName = novoNome;
            return `Prazer, ${memoria.nome}! Vou lembrar de você 😊`;
        }
        
        const idadeMatch = pergunta.match(/(\d{1,2}) anos/);
        if (idadeMatch) {
            memoria.idade = idadeMatch[1];
            localStorage.setItem("candinho_idade", memoria.idade);
            return `Legal! Você tem ${memoria.idade} anos 🎈`;
        }
        
        const interesses = ["desenhar", "pintar", "dançar", "música", "teatro"];
        for (let interesse of interesses) {
            if (texto.includes(interesse)) {
                if (!memoria.interesses.includes(interesse)) {
                    memoria.interesses.push(interesse);
                    localStorage.setItem("candinho_interesses", JSON.stringify(memoria.interesses));
                    return `Que legal que você gosta de ${interesse}! 🎨`;
                }
            }
        }
        return null;
    }
    
    function addLoading() {
        const div = document.createElement("div");
        div.className = "msg bot loading";
        div.id = "loadingMsg";
        div.innerText = "Candinho está pensando... 🖌️";
        chatDiv.appendChild(div);
        chatDiv.scrollTop = chatDiv.scrollHeight;
    }
    
    function removeLoading() {
        const el = document.getElementById("loadingMsg");
        if (el) el.remove();
    }
    
    function normalizar(texto) {
        return texto.toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .trim();
    }
    
    // ======================= FUNÇÃO PARA CHAMAR O BACK-END =======================
    async function chamarBackend(pergunta) {
        try {
            const resposta = await fetch('/api/groq', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    mensagem: pergunta,
                    memoria: memoria 
                })
            });
            
            const dados = await resposta.json();
            
            // Se o back-end retornou uma imagem da Europeana
            if (dados.image && dados.image.imagemUrl) {
                addImageToUI(dados.image.titulo, dados.image.imagemUrl, dados.image.credito);
            }
            
            // Se retornou várias obras
            if (dados.artworks && dados.artworks.length > 0) {
                dados.artworks.slice(0, 2).forEach(obra => {
                    if (obra.imagem) {
                        addImageToUI(obra.titulo, obra.imagem, "Europeana");
                    }
                });
            }
            
            return dados.reply;
        } catch (erro) {
            console.error("Erro no back-end:", erro);
            return "Estou com dificuldades técnicas. Tente novamente! 🎨";
        }
    }
    
    function detectarTemaPrioritario(texto) {
        const txt = normalizar(texto);
        if (txt.includes("oi") || txt.includes("ola") || txt.includes("bom dia") ||
            txt.includes("boa tarde") || txt.includes("boa noite") || txt.includes("oie") || txt === "hey" ||
            txt.includes("opa") || txt.includes("e aí") || txt.includes("hello") || txt.includes("qual é") || txt.includes("fala")) {
            return "saudacoes";
        }
        if (txt.includes("tchau") || txt.includes("adeus") || txt.includes("até logo") || txt.includes("até mais") ||
            txt.includes("falou") || txt.includes("bye") || txt.includes("sair") || txt.includes("nos vemos") || txt.includes("até amanhã")) {
            return "despedidas";
        }
        if (txt.includes("obrigado") || txt.includes("obrigada") || txt.includes("valeu") || txt.includes("grato") ||
            txt.includes("grata") || txt.includes("agradecido")) {
            return "agradecimentos";
        }
        if (txt.includes("gostei") || txt.includes("muito bom") || txt.includes("legal") || txt.includes("bacana") ||
            txt.includes("show") || txt.includes("incrível") || txt.includes("maravilhoso") || txt.includes("lindo")) {
            return "elogios";
        }
        if (txt.includes("triste") || txt.includes("ansioso") || txt.includes("medo") ||
            txt.includes("raiva") || txt.includes("sozinho") || txt.includes("vergonha") ||
            txt.includes("frustrado") || txt.includes("saudade") || txt.includes("ciumes")) {
            return "apoio_emocional";
        }
        if (txt.includes("piada") || txt.includes("engracado") || txt.includes("engraçada")) {
            return "piadas";
        }
        if (txt.includes("curiosidade") || txt.includes("sabia que")) {
            return "curiosidades";
        }
        const nomesCantigas = [
            "escravos de jó", "ciranda cirandinha", "capelinha de melão", "peixe vivo",
            "galinha do vizinho", "borboletinha", "meu limão", "barata diz que tem",
            "alecrim", "cai cai balão", "pirulito que bate", "pombinha branca",
            "terezinha de jesus", "indiozinhos", "se essa rua fosse minha", "cravo e a rosa",
            "sapo não lava o pé", "marcha soldado", "fui no tororó", "ai eu entrei na roda",
            "canoa virou", "rosa amarela", "quem me ensinou a nadar", "sapo cururu",
            "meu galinho", "marinheiro só", "pezinho", "vai abóbora", "roda pião",
            "caranguejo", "na loja do mestre andré", "meu boi morreu", "tutu marambá",
            "você gosta de mim", "vamos maninha", "que é de valentim", "na bahia tem",
            "gatinha parda", "balaio", "barraquinha", "boi barroso", "pobre cego",
            "são joão da rão"
        ];
        if (nomesCantigas.some(nome => txt.includes(nome))) return "cantigas_de_roda";
        const literaturaPalavras = ["poema", "poesia", "verso", "estrofe", "métrica", "literatura", "gênero literário", "narrativa", "personagem", "enredo", "narrador"];
        if (literaturaPalavras.some(p => txt.includes(p))) return "literatura_conceitos";
        const imaginacaoPalavras = ["animal magico", "super heroi", "monstro", "criatura", "desenho facil", "arte maluca", "arte engraçada", "imaginacao", "imaginação", "coisa assustadora", "desenho engraçado", "cor diferente"];
        if (imaginacaoPalavras.some(p => txt.includes(p))) return "imaginacao_infantil";
        const fantasticosPalavras = ["duende", "bruxa", "mago", "dragão", "alienígena", "fantasma", "lobisomem", "cuca", "saci", "iara", "curupira", "boitatá", "boto", "personagem fantástico", "criatura mágica", "ser mágico"];
        if (fantasticosPalavras.some(p => txt.includes(p))) return "personagens_fantasticos";
        const tecnicasPalavras = ["aquarela", "origami", "colagem", "mosaico", "gravura", "xilogravura", "stencil", "tecnica", "maneira de desenhar"];
        if (tecnicasPalavras.some(p => txt.includes(p))) return "arte_tecnicas";
        if (txt.includes("abaporu") || txt.includes("operarios") || txt.includes("antropofagia") || txt.includes("a cuca")) return "obras_modernistas_brasileiras";
        const artistasUnivPalavras = ["van gogh", "monet", "picasso", "dali", "frida", "michelangelo", "da vinci", "duchamp", "gaudi", "kandinsky", "warhol", "kusama", "rembrandt", "vermeer", "degas", "cezanne", "magritte", "klimt", "munch", "matisse", "pollock", "haring", "banksy", "modigliani", "okeeffe", "chagall", "klee", "lichtenstein", "botero", "basquiat"];
        if (artistasUnivPalavras.some(p => txt.includes(p))) return "artistas_universais";
        if (txt.includes("tarsila") || txt.includes("portinari") || txt.includes("di cavalcanti") || txt.includes("candido portinari") || txt.includes("artista") || txt.includes("pintor")) return "artistas";
        const obrasPalavras = ["mona lisa", "noite estrelada", "guernica", "o beijo", "grande onda", "ultima ceia", "o grito", "persistência da memória"];
        if (obrasPalavras.some(p => txt.includes(p))) return "obras_famosas_mundo";
        const lugaresPalavras = ["louvre", "moma", "masp", "inhotim", "acrópole", "coliseu", "torre eiffel", "machu picchu", "sagrada família", "bienal"];
        if (lugaresPalavras.some(p => txt.includes(p))) return "lugares_arte";
        const historiaPalavras = ["arte rupestre", "arte egípcia", "arte grega", "arte romana", "arte medieval", "renascimento", "barroco", "impressionismo", "modernismo", "cubismo", "surrealismo", "arte contemporânea"];
        if (historiaPalavras.some(p => txt.includes(p))) return "historia_arte";
        const ritmosPalavras = ["samba", "forró", "frevo", "maracatu", "axé", "funk", "bossa nova", "rock", "rap", "k-pop", "sertanejo", "pagode", "reggae", "pop", "jazz", "blues", "hip hop", "música clássica", "eletrônica"];
        if (ritmosPalavras.some(p => txt.includes(p))) return "ritmos_musicais";
        if (txt.includes("indigena") || txt.includes("tupi") || txt.includes("grafismo") || txt.includes("cestaria") || txt.includes("aldeia") || txt.includes("pintura corporal")) return "cultura_indigena";
        if (txt.includes("quilombo") || txt.includes("orixa") || txt.includes("cultura afro") || txt.includes("afro brasileira")) return "cultura_afro_brasileira";
        const culturaBrPalavras = ["cordel", "repente", "capoeira", "reisado", "boi bumbá", "cacuriá", "pastoril", "quadrilha", "lavadeiras", "festa do divino"];
        if (culturaBrPalavras.some(p => txt.includes(p))) return "cultura_brasileira";
        if (txt.includes("danca") || txt.includes("dança") || txt.includes("ballet") || txt.includes("coreografia") || txt.includes("frevo") || txt.includes("ciranda")) return "dancas";
        if (txt.includes("musica") || txt.includes("canção") || txt.includes("instrumento") || txt.includes("violao") || txt.includes("tambor")) return "musica";
        if (txt.includes("teatro") || txt.includes("peca") || txt.includes("ator") || txt.includes("fantoche")) return "teatro";
        if (txt.includes("carnaval") || txt.includes("festa junina") || txt.includes("parintins")) return "festas_brasileiras";
        if (txt.includes("atividade") || txt.includes("oficina") || txt.includes("brincadeira") || txt.includes("desafio")) return "atividades_artisticas";
        const artesVisuaisKeywords = ["cor primaria", "cores primarias", "cor secundaria", "cores secundarias", "linha", "forma", "textura", "perspectiva", "pintura", "desenho", "escultura", "grafite", "fotografia"];
        if (artesVisuaisKeywords.some(kw => txt.includes(kw))) return "artes_visuais";
        return null;
    }
    
    let contexto = {
        personagem: null,
        tema: null,
        ultimaPergunta: null
    };
    
    function buscarEmJSON(jsonObj, pergunta) {
        if (!jsonObj || typeof jsonObj !== "object") return null;
        const textoNorm = normalizar(pergunta);
        const perguntasContexto = ["quem foi", "quem e", "quem é", "o que ele fez", "o que ela fez", "onde nasceu", "onde morava", "o que pintou", "o que criou"];
        const ehPerguntaContexto = perguntasContexto.some(p => textoNorm.includes(p));
        if (ehPerguntaContexto && contexto.personagem) {
            for (const chave in jsonObj) {
                const item = jsonObj[chave];
                if (chave === contexto.personagem && item && typeof item === "object") {
                    const respostaContexto = montarResposta(item);
                    if (respostaContexto) return respostaContexto;
                }
            }
        }
        function montarResposta(item) {
            let partes = [];
            if (item.inicio?.[0]) partes.push(item.inicio[0]);
            if (item.explicacao_curta?.[0]) partes.push(item.explicacao_curta[0]);
            if (item.explicacao_aprofundada?.[0]) partes.push(item.explicacao_aprofundada[0]);
            if (item.curiosidade?.[0]) partes.push(item.curiosidade[0]);
            if (item.interacao?.[0]) partes.push(item.interacao[0]);
            if (item.atividade?.[0]) partes.push(item.atividade[0]);
            if (item.final?.[0]) partes.push(item.final[0]);
            if (item.despedida?.[0]) partes.push(item.despedida[0]);
            if (item.acolhimento?.[0]) partes.push(item.acolhimento[0]);
            if (partes.length === 0 && typeof item.explicacao_infantil === "string") partes.push(item.explicacao_infantil);
            if (partes.length === 0 && typeof item.resposta === "string") partes.push(item.resposta);
            if (partes.length === 0 && Array.isArray(item.respostas)) partes.push(item.respostas[Math.floor(Math.random() * item.respostas.length)]);
            return partes.join("\n\n").trim();
        }
        function buscarRecursivo(obj) {
            if (!obj || typeof obj !== "object") return null;
            for (const chave in obj) {
                const item = obj[chave];
                if (item && typeof item === "object" && Array.isArray(item.palavras_chave)) {
                    const encontrou = item.palavras_chave.some(p => textoNorm.includes(normalizar(p)));
                    if (encontrou) {
                        contexto.personagem = chave;
                        contexto.ultimaPergunta = pergunta;
                        ultimoPersonagem = chave;
                        const resposta = montarResposta(item);
                        if (resposta && typeof resposta === "string" && resposta.trim().length > 0) return resposta;
                    }
                }
                if (item && typeof item === "object") {
                    const resultado = buscarRecursivo(item);
                    if (resultado) return resultado;
                }
            }
            return null;
        }
        return buscarRecursivo(jsonObj);
    }
    
    function respostaInstantanea(pergunta) {
        const tema = detectarTemaPrioritario(pergunta);
        const txt = normalizar(pergunta);
        
        // TRATAMENTO ESPECIAL PARA SAUDAÇÕES, DESPEDIDAS, AGRADECIMENTOS E ELOGIOS
        if (tema === "saudacoes" && dataStore.saudacoes && dataStore.saudacoes.saudacoes) {
            const saudacoesData = dataStore.saudacoes.saudacoes;
            let resposta = '';
            if (saudacoesData.inicio && saudacoesData.inicio.length > 0) {
                resposta += saudacoesData.inicio[Math.floor(Math.random() * saudacoesData.inicio.length)] + '\n\n';
            }
            if (saudacoesData.curiosidade && saudacoesData.curiosidade.length > 0) {
                resposta += saudacoesData.curiosidade[Math.floor(Math.random() * saudacoesData.curiosidade.length)] + '\n\n';
            }
            if (saudacoesData.interacao && saudacoesData.interacao.length > 0) {
                resposta += saudacoesData.interacao[Math.floor(Math.random() * saudacoesData.interacao.length)] + '\n\n';
            }
            if (saudacoesData.final && saudacoesData.final.length > 0) {
                resposta += saudacoesData.final[Math.floor(Math.random() * saudacoesData.final.length)];
            }
            if (resposta) return resposta;
        }
        
        if (tema === "despedidas" && dataStore.saudacoes && dataStore.saudacoes.despedidas) {
            const despedidasData = dataStore.saudacoes.despedidas;
            let resposta = '';
            if (despedidasData.inicio && despedidasData.inicio.length > 0) {
                resposta += despedidasData.inicio[Math.floor(Math.random() * despedidasData.inicio.length)] + '\n\n';
            }

        if (tema === "elogios" && dataStore.saudacoes && dataStore.saudacoes.elogios) {

            let resposta = '';
            if (elogiosData.inicio && elogiosData.inicio.length > 0) {

            }

        if (tema === "piadas" && dataStore.piadas) {

                return aleatoria.explicacao_infantil || aleatoria.resposta || "😂 Não sei nenhuma piada agora!";
            }
        }

        if (tema === "curiosidades" && dataStore.curiosidades) {
            const curiosArray = Object.values(dataStore.curiosidades);
            if (curiosArray.length) {
                const aleatoria = curiosArray[Math.floor(Math.random() * curiosArray.length)];
                if (typeof aleatoria === "string") return aleatoria;
                return aleatoria.explicacao_infantil || aleatoria.resposta;
            }
        }
        
        // CANTIGAS DE RODA
        if (tema === "cantigas_de_roda") {
            const cantigas = dataStore.cantigas_de_roda?.cantigas_de_roda;
            if (!cantigas) return null;
            const txtLower = normalizar(pergunta);
            const cantigaEncontrada = cantigas.find(c => normalizar(c.titulo).includes(txtLower) || c.palavras_chave.some(p => txtLower.includes(normalizar(p))));
            if (cantigaEncontrada) return `🎵 **${cantigaEncontrada.titulo}** 🎵\n\n${cantigaEncontrada.letra}`;
            return null;
        }
        
        // MAPEAMENTO DE TEMAS PARA BUSCA
        let chavesBusca = [];
        if (tema === "arte") chavesBusca = ["artes_visuais", "arte_tecnicas", "arte_artista", "artistas", "artistas_universais", "historia_arte", "lugares_arte", "obras_famosas_mundo", "obras_modernistas_brasileiras"];
        else if (tema === "danca") chavesBusca = ["dancas", "ritmos_musicais", "cultura_afro_brasileira", "cultura_brasileira", "festas_brasileiras"];
        else if (tema === "musica") chavesBusca = ["musica", "ritmos_musicais", "cultura_afro_brasileira", "cultura_brasileira", "festas_brasileiras", "cantigas_de_roda"];
        else if (tema === "teatro") chavesBusca = ["teatro"];
        else if (tema === "folclore") chavesBusca = ["folclore", "imaginacao_infantil", "personagens_fantasticos", "cultura_brasileira", "cantigas_de_roda"];
        else if (tema === "festas") chavesBusca = ["festas_brasileiras", "cultura_afro_brasileira", "cultura_brasileira", "dancas", "musica", "ritmos_musicais"];
        else if (tema === "indigena") chavesBusca = ["cultura_indigena", "artes_visuais", "folclore", "personagens_fantasticos"];
        else if (tema === "afro") chavesBusca = ["cultura_afro_brasileira", "musica", "dancas", "festas_brasileiras", "ritmos_musicais"];
        else if (tema === "atividades") chavesBusca = ["atividades_artisticas", "arte_tecnicas", "imaginacao_infantil", "personagens_fantasticos"];
        else if (tema === "artista") chavesBusca = ["artistas", "artistas_universais", "arte_artista", "historia_arte", "obras_famosas_mundo", "obras_modernistas_brasileiras"];
        else if (tema === "tecnicas") chavesBusca = ["arte_tecnicas", "artes_visuais", "atividades_artisticas"];
        else if (tema === "imaginacao") chavesBusca = ["imaginacao_infantil", "personagens_fantasticos", "folclore", "atividades_artisticas", "cantigas_de_roda"];
        else if (tema === "emocional") chavesBusca = ["apoio_emocional"];
        else if (tema === "literatura") chavesBusca = ["literatura_conceitos", "cantigas_de_roda", "imaginacao_infantil"];
        else if (tema === "cantigas") chavesBusca = ["cantigas_de_roda", "musica", "folclore"];
        else if (tema === "personagens") chavesBusca = ["personagens_fantasticos", "folclore", "imaginacao_infantil"];
        else chavesBusca = Object.keys(dataStore).filter(k => k !== "piadas" && k !== "curiosidades" && k !== "saudacoes");
        
        for (let chave of chavesBusca) {
            const obj = dataStore[chave];
            if (obj) {
                const resposta = buscarEmJSON(obj, pergunta);
                if (resposta && typeof resposta === "string" && resposta.trim().length > 0) return resposta;
            }
        }
        
        // FALLBACK "O QUE É"
        if (txt.includes("o que e") || txt.includes("o que é")) {
            if (txt.includes("musica")) {
                const item = dataStore.musica?.o_que_e_musica;
                if (item?.inicio?.[0]) return item.inicio[0];
            }

                const item = dataStore.dancas?.o_que_e_danca;
                if (item?.inicio?.[0]) return item.inicio[0];
                const primeiroItem = dataStore.dancas?.[Object.keys(dataStore.dancas)[0]];
                if (primeiroItem?.inicio) return primeiroItem.inicio[0];
            }

                const item = dataStore.teatro?.o_que_e_teatro;
                if (item?.inicio?.[0]) return item.inicio[0];

                const item = dataStore.folclore?.o_que_e_folclore;
                if (item?.inicio?.[0]) return item.inicio[0];
            }

                const item = dataStore.literatura_conceitos?.o_que_e_literatura;
                if (item?.inicio?.[0]) return item.inicio[0];
            }

                const item = dataStore.literatura_conceitos?.o_que_e_poema;
                if (item?.inicio?.[0]) return item.inicio[0];
            }

                if (item?.inicio?.[0]) return item.inicio[0];

                const primeiraCantiga = dataStore.cantigas_de_roda?.cantigas_de_roda?.[0];
                if (primeiraCantiga?.inicio) return `Cantiga de roda é uma música tradicional cantada em roda, geralmente com coreografia. Exemplo: "${primeiraCantiga.titulo}" - ${primeiraCantiga.inicio[0]}`;

                return "Pintura é uma forma de arte onde usamos tintas e pincéis para criar imagens coloridas em telas ou papéis 🖌️";

        return null;
    }
    
    function buscarArtistaPorNome(nomeBuscado) {
        const nomeNorm = normalizar(nomeBuscado);
        const fontesArtistas = [
            dataStore.artistas,
            dataStore.artistas_universais,
            dataStore.artistas_indigenas_afrobrasileiros,
            dataStore.artistas_mulheres_historicas
        ];
        
        const mapNomeChave = {
            "leonardo da vinci": "leonardo_da_vinci",
            "leonardo": "leonardo_da_vinci",
            "michelangelo": "michelangelo",
            "van gogh": "vincent_van_gogh",
            "picasso": "pablo_picasso",
            "dali": "salvador_dali",
            "frida": "frida_kahlo",
            "frida kahlo": "frida_kahlo",
            "monet": "claude_monet",
            "tarsila": "tarsila_do_amaral",
            "portinari": "candido_portinari"
        };
        
        let chaveDireta = mapNomeChave[nomeNorm];
        if (chaveDireta) {
            for (const fonte of fontesArtistas) {
                if (fonte && fonte[chaveDireta]) return { fonte, chave: chaveDireta, dados: fonte[chaveDireta] };
            }
        }
        
        for (const fonte of fontesArtistas) {
            if (!fonte) continue;
            for (const [chave, dados] of Object.entries(fonte)) {
                const chaveNorm = chave.toLowerCase().replace(/_/g, ' ');
                if (chaveNorm.includes(nomeNorm) || nomeNorm.includes(chaveNorm)) {
                    return { fonte, chave, dados };
                }
                if (dados.palavras_chave && dados.palavras_chave.some(p => normalizar(p).includes(nomeNorm))) {
                    return { fonte, chave, dados };
                }
            }
        }
        return null;
    }
    
    function extrairNomeDaPergunta(pergunta) {
        const padroes = [
            /quando nasceu\s+([A-Za-zÀ-ÖØ-öø-ÿ\s]+)/i,
            /onde nasceu\s+([A-Za-zÀ-ÖØ-öø-ÿ\s]+)/i,
            /em que ano nasceu\s+([A-Za-zÀ-ÖØ-öø-ÿ\s]+)/i,
            /ano de nascimento de\s+([A-Za-zÀ-ÖØ-öø-ÿ\s]+)/i,
            /quando morreu\s+([A-Za-zÀ-ÖØ-öø-ÿ\s]+)/i,
            /em que ano morreu\s+([A-Za-zÀ-ÖØ-öø-ÿ\s]+)/i,
            /o que (ele|ela) fez\s+([A-Za-zÀ-ÖØ-öø-ÿ\s]+)/i
        ];
        for (const padrao of padroes) {
            const match = pergunta.match(padrao);
            if (match) {
                let nome = match[1] || match[2];
                if (nome) return nome.trim().replace(/[?!.,]+$/, '');
            }
        }
        return null;
    }
    
    // ======================= FUNÇÃO RESPONDER PRINCIPAL =======================
    async function responder(pergunta) {
        // 1. PERGUNTAS CONTEXTUAIS COM NOME EXTRAÍDO
        const nomeExtraido = extrairNomeDaPergunta(pergunta);
        if (nomeExtraido) {
            const artista = buscarArtistaPorNome(nomeExtraido);
            if (artista) {
                ultimoPersonagem = artista.chave;
            }
        }
        
        // 2. PERGUNTAS CONTEXTUAIS SOBRE O ÚLTIMO PERSONAGEM
        const txt = normalizar(pergunta);
        if (ultimoPersonagem) {
            let personagemData = null;
            const fontesArtistas = [
                dataStore.artistas,
                dataStore.artistas_universais,
                dataStore.artistas_indigenas_afrobrasileiros,
                dataStore.artistas_mulheres_historicas
            ];
            for (const fonte of fontesArtistas) {
                if (fonte && fonte[ultimoPersonagem]) {
                    personagemData = fonte[ultimoPersonagem];
                    break;
                }
            }
            
            if (personagemData) {
                const nomeArtista = ultimoPersonagem.replace(/_/g, ' ').split(' ').map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' ');
                
                if (txt.includes("o que ele fez") || txt.includes("o que ela fez") || txt.includes("o que criou") || txt.includes("o que pintou") || txt.includes("o que fez")) {
                    if (personagemData.o_que_ele_fez && Array.isArray(personagemData.o_que_ele_fez)) {
                        const resposta = personagemData.o_que_ele_fez.join(' ');
                        historicoMensagens.push({ role: "user", content: pergunta });
                        historicoMensagens.push({ role: "assistant", content: resposta });
                        return resposta;
                    }
                }
                if (txt.includes("ano nasceu") || txt.includes("ano de nascimento") || txt.includes("quando nasceu")) {
                    if (personagemData.ano_nascimento) {
                        const resposta = `${nomeArtista} nasceu no ano de ${personagemData.ano_nascimento}.`;
                        historicoMensagens.push({ role: "user", content: pergunta });
                        historicoMensagens.push({ role: "assistant", content: resposta });
                        return resposta;
                    }
                }
                if (txt.includes("onde nasceu") || txt.includes("local de nascimento")) {
                    if (personagemData.local_nascimento) {
                        const resposta = `${nomeArtista} nasceu em ${personagemData.local_nascimento}.`;
                        historicoMensagens.push({ role: "user", content: pergunta });
                        historicoMensagens.push({ role: "assistant", content: resposta });
                        return resposta;
                    }
                }
                if (txt.includes("ano morreu") || txt.includes("morreu em que ano") || txt.includes("quando morreu") || txt.includes("faleceu")) {
                    if (personagemData.ano_falecimento) {
                        const resposta = `${nomeArtista} faleceu no ano de ${personagemData.ano_falecimento}.`;
                        historicoMensagens.push({ role: "user", content: pergunta });
                        historicoMensagens.push({ role: "assistant", content: resposta });
                        return resposta;
                    } else if (personagemData.ano_falecimento === "") {
                        const resposta = `${nomeArtista} ainda está vivo(a) e continua criando!`;
                        historicoMensagens.push({ role: "user", content: pergunta });
                        historicoMensagens.push({ role: "assistant", content: resposta });
                        return resposta;
                    }
                }
            }
        }
        
        // 3. TRATAMENTO PARA "QUEM FOI X?" ou "QUEM É X?"
        const quemMatch = pergunta.match(/quem (foi|é)\s+([A-Za-zÀ-ÖØ-öø-ÿ\s]+)/i);
        if (quemMatch) {
            let nomeBuscado = quemMatch[2].trim();
            nomeBuscado = nomeBuscado.replace(/[?!.,]+$/, '');
            
            const resultado = buscarArtistaPorNome(nomeBuscado);
            if (resultado && resultado.dados) {
                let resposta = '';
                if (resultado.dados.inicio?.[0]) resposta += resultado.dados.inicio[0] + '\n\n';
                if (resultado.dados.explicacao_curta?.[0]) resposta += resultado.dados.explicacao_curta[0] + '\n\n';
                if (resultado.dados.curiosidade?.[0]) resposta += resultado.dados.curiosidade[0];
                if (!resposta && resultado.dados.explicacao_infantil) resposta = resultado.dados.explicacao_infantil;
                if (!resposta && resultado.dados.resposta) resposta = resultado.dados.resposta;
                if (resposta) {
                    ultimoPersonagem = resultado.chave;
                    historicoMensagens.push({ role: "user", content: pergunta });
                    historicoMensagens.push({ role: "assistant", content: resposta });
                    return resposta;
                }
            }
        }
        
        // 4. MEMÓRIA
        const memoriaDetectada = extrairMemoria(pergunta);
        if (memoriaDetectada) {
            historicoMensagens.push({ role: "user", content: pergunta });
            historicoMensagens.push({ role: "assistant", content: memoriaDetectada });
            return memoriaDetectada;
        }
        
        if (pergunta.toLowerCase().includes("meu nome")) {
            return memoria.nome ? `Seu nome é ${memoria.nome}! 😊` : "Você ainda não me contou seu nome!";
        }
        if (pergunta.toLowerCase().includes("quantos anos eu tenho")) {
            return memoria.idade ? `Você tem ${memoria.idade} anos! 🎈` : "Você ainda não me contou sua idade!";
        }
        
        // 5. RESPOSTA INSTANTÂNEA (JSONs locais)
        const instant = respostaInstantanea(pergunta);
        if (instant) {
            historicoMensagens.push({ role: "user", content: pergunta });
            historicoMensagens.push({ role: "assistant", content: instant });
            return instant;
        }
        
        // 6. SE NÃO ACHOU, CHAMA O BACK-END (GROQ + EUROPEANA)
        const respostaBackend = await chamarBackend(pergunta);
        historicoMensagens.push({ role: "user", content: pergunta });
        historicoMensagens.push({ role: "assistant", content: respostaBackend });
        return respostaBackend;
    }
    
    async function carregarTodosJSONs() {
        statusDiv.innerText = "📥 Baixando respostas instantâneas...";
        const promises = [];
        for (const [key, filename] of Object.entries(jsonFiles)) {
            const url = GITHUB_BASE + filename;
            promises.push(
                fetch(url)
                    .then(res => res.ok ? res.json() : (console.warn(`Arquivo ${filename} não encontrado`), {}))
                    .catch(err => { console.warn(`Erro ${filename}:`, err); return {}; })
            );
        }
        const resultados = await Promise.all(promises);
        let idx = 0;
        for (const key of Object.keys(jsonFiles)) {
            dataStore[key] = resultados[idx++];
        }
        const carregados = Object.keys(dataStore).filter(k => Object.keys(dataStore[k]).length > 0);
        console.log("JSONs carregados:", carregados);
        statusDiv.innerText = carregados.length ? "🎨 Candinho pronto!" : "⚠️ Respostas instantâneas indisponíveis";
    }
    
    let isProcessing = false;
    async function enviar() {
        if (isProcessing) return;
        const texto = inputField.value.trim();
        if (!texto) return;
        isProcessing = true;
        sendBtn.disabled = true;
        inputField.disabled = true;
        addMessageToUI(texto, true);
        inputField.value = "";
        addLoading();
        try {
            const resposta = await responder(texto);
            removeLoading();
            addMessageToUI(resposta, false);
        } catch (err) {
            removeLoading();
            addMessageToUI("Ops! Ocorreu um erro inesperado.", false, true);
            console.error(err);
        } finally {
            isProcessing = false;
            sendBtn.disabled = false;
            inputField.disabled = false;
            inputField.focus();
        }
    }
    
    sendBtn.addEventListener("click", enviar);
    inputField.addEventListener("keypress", (e) => { if (e.key === "Enter" && !isProcessing) enviar(); });
    
    async function init() {
        await carregarTodosJSONs();
        historicoMensagens = [];
        let boasVindas = "Olá! Sou o Candinho, seu amigo artista. Pergunte sobre artistas, artes...! 🖌️";
        if (nomeUsuario) boasVindas = `Olá, ${nomeUsuario}! Sou o Candinho, seu amigo artista. Vamos criar? 🎨`;
        addMessageToUI(boasVindas, false);
        historicoMensagens.push({ role: "assistant", content: boasVindas });
    }
    
    init().catch(err => {
        console.error(err);
        statusDiv.innerText = "Erro crítico ao iniciar.";
        addMessageToUI("Não foi possível carregar os conhecimentos do Candinho. Verifique a conexão.", false, true);
    });
