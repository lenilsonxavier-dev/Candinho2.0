<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Candinho - Artista Amigo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white; 
            padding: 15px; 
            display: flex; 
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container { 
            width: 100%; 
            max-width: 800px;
            background: rgba(22, 33, 62, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 25px; 
            box-shadow: 0 15px 50px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        
        .header { 
            display: flex; 
            align-items: center; 
            gap: 20px; 
            margin-bottom: 20px; 
            padding-bottom: 15px; 
            border-bottom: 2px solid #e94560; 
        }
        
        .avatar { 
            width: 110px;
            height: 110px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 3px solid #ffd700;
            animation: float 4s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        
        .title h1 { font-size: 1.8rem; }
        .title small { color: #ffd700; }
        
        #chat { 
            height: 450px;
            overflow-y: auto; 
            background: rgba(15, 52, 96, 0.4);
            padding: 20px; 
            border-radius: 20px; 
            margin-bottom: 20px; 
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .msg {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 1rem;
            line-height: 1.5;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user {
            background: #4834d4;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .bot {
            background: #686de0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .bot-message-wrapper { 
            display: flex; 
            align-items: flex-start; 
            gap: 15px; 
        }

        .bot-icon {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
        }

        .bot-text { flex: 1; }

        .bot-image {
            margin-top: 15px;
            max-width: 100%;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.3s;
            border: 2px solid #ffd700;
        }
        
        .bot-image:hover { transform: scale(1.02); }

        .image-credit {
            font-size: 0.65rem;
            color: #ffd700;
            margin-top: 5px;
            text-align: center;
        }

        .input-area { display: flex; gap: 10px; margin-top: 10px; }
        
        input {
            flex: 1;
            padding: 15px 25px;
            border: 2px solid #e94560;
            border-radius: 30px;
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 1rem;
            outline: none;
        }
        
        input:focus { border-color: #ffd700; }

        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 0 30px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
        }
        
        button:disabled { opacity: 0.5; }

        .loading { opacity: 0.8; }

        .modal {
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: rgba(0,0,0,0.95); 
            z-index: 9999; 
            justify-content: center; 
            align-items: center;
            cursor: pointer;
        }
        
        .modal img { 
            max-width: 90%; 
            max-height: 90%; 
            border-radius: 10px; 
        }

        .error-box {
            background: rgba(233, 69, 96, 0.3);
            border-left: 4px solid #e94560;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="https://i.imgur.com/fnMYS0Z.png" alt="Candinho" class="avatar">
        <div class="title">
            <h1>Candinho</h1>
            <small>Seu amigo artista 🎨🇧🇷</small>
        </div>
    </div>

    <div id="chat"></div>

    <div class="input-area">
        <input type="text" id="pergunta" placeholder="Ex: Mostra obra da Tarsila" autocomplete="off">
        <button id="sendBtn">Enviar</button>
    </div>
</div>

<div id="imgModal" class="modal" onclick="this.style.display='none'">
    <img id="modalImg" src="">
</div>

<script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("pergunta");
    const btn = document.getElementById("sendBtn");
    let isProcessing = false;

    function appendMessage(text, side, extra = null) {
        const msgDiv = document.createElement("div");
        msgDiv.className = `msg ${side}`;

        if (side === 'bot') {
            const wrapper = document.createElement("div");
            wrapper.className = "bot-message-wrapper";
            wrapper.innerHTML = `<img src="https://i.imgur.com/UDl1c5j.png" class="bot-icon" alt="Candinho">`;
            
            const textSpan = document.createElement("span");
            textSpan.className = "bot-text";
            textSpan.innerHTML = text;
            wrapper.appendChild(textSpan);
            msgDiv.appendChild(wrapper);

            if (extra?.image?.imagemUrl) {
                const img = document.createElement("img");
                img.src = extra.image.imagemUrl;
                img.className = "bot-image";
                img.alt = extra.image.titulo || "Obra de arte";
                img.onclick = () => {
                    document.getElementById("modalImg").src = extra.image.imagemUrl;
                    document.getElementById("imgModal").style.display = "flex";
                };
                msgDiv.appendChild(img);
                
                if (extra.image.credito) {
                    const credit = document.createElement("div");
                    credit.className = "image-credit";
                    credit.innerHTML = `📷 ${extra.image.credito}`;
                    msgDiv.appendChild(credit);
                }
            } else if (extra?.image === null) {
                const errorDiv = document.createElement("div");
                errorDiv.className = "error-box";
                errorDiv.innerHTML = "⚠️ Não consegui encontrar uma imagem para essa obra. Tente outro artista!";
                msgDiv.appendChild(errorDiv);
            }
        } else {
            msgDiv.innerText = text;
        }

        chat.appendChild(msgDiv);
        chat.scrollTop = chat.scrollHeight;
    }

    async function handleSend() {
        const val = input.value.trim();
        if (!val || isProcessing) return;

        isProcessing = true;
        btn.disabled = true;
        input.disabled = true;

        appendMessage(val, 'user');
        input.value = "";

        const loadingDiv = document.createElement("div");
        loadingDiv.className = "msg bot loading";
        loadingDiv.id = "loader";
        loadingDiv.innerHTML = `
            <div class="bot-message-wrapper">
                <img src="https://i.imgur.com/UDl1c5j.png" class="bot-icon">
                <span>🎨 Pesquisando obra... aguarde um momento</span>
            </div>
        `;
        chat.appendChild(loadingDiv);
        chat.scrollTop = chat.scrollHeight;

        try {
            console.log("📤 Enviando requisição para:", "/api/groq");
            
            const res = await fetch("/api/groq", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ mensagem: val })
            });

            console.log("📥 Resposta recebida:", res.status);

            if (!res.ok) {
                throw new Error(`HTTP ${res.status}: ${res.statusText}`);
            }

            const data = await res.json();
            console.log("📦 Dados recebidos:", data);

            document.getElementById("loader")?.remove();

            if (data.image && data.image.imagemUrl) {
                console.log("🖼️ Imagem encontrada:", data.image.imagemUrl);
                appendMessage(data.reply, 'bot', { image: data.image });
            } else if (data.image === null || !data.image?.imagemUrl) {
                console.log("⚠️ Nenhuma imagem encontrada");
                appendMessage(data.reply + "\n\n🔍 Tente ser mais específico, como: 'Mostra Abaporu da Tarsila'", 'bot', { image: null });
            } else {
                appendMessage(data.reply, 'bot');
            }

        } catch (error) {
            console.error("❌ Erro:", error);
            document.getElementById("loader")?.remove();
            appendMessage("Ops! Estou com problemas para acessar as imagens. Pode tentar novamente? 🎨", "bot");
            appendMessage(`🔧 Detalhe técnico: ${error.message}`, "bot");
        } finally {
            isProcessing = false;
            btn.disabled = false;
            input.disabled = false;
            input.focus();
        }
    }

    btn.addEventListener("click", handleSend);
    input.addEventListener("keypress", (e) => {
        if (e.key === "Enter") handleSend();
    });

    window.onload = () => {
        appendMessage("Olá! Sou o Candinho. Peça para eu mostrar obras de arte como: 'Mostra obra da Tarsila' ou 'Quem foi Portinari?' 🎨🇧🇷", "bot");
        input.focus();
    };
</script>

</body>
</html>
