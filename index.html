<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Candinho</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #ffeaa7, #81ecec);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
    }
    .container {
        max-width: 800px;
        width: 100%;
        background: white;
        border-radius: 35px;
        box-shadow: 0 20px 35px rgba(0,0,0,0.2);
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }
    .header {
        background: #6c5ce7;
        color: white;
        padding: 20px;
        text-align: center;
    }
    .avatar {
        width: 80px;
        border-radius: 50%;
        border: 3px solid #f9b713;
        margin-bottom: 10px;
    }
    .header h2 { margin: 0; font-size: 1.6rem; }
    #chat {
        height: 400px;
        overflow-y: auto;
        background: #f8f9fa;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .msg {
        max-width: 80%;
        padding: 10px 15px;
        border-radius: 20px;
        word-wrap: break-word;
        animation: fadeIn 0.2s ease;
    }
    .user {
        background: #74b9ff;
        align-self: flex-end;
        color: #000;
        border-bottom-right-radius: 5px;
    }
    .bot {
        background: #55efc4;
        align-self: flex-start;
        border-bottom-left-radius: 5px;
    }
    .bot-image {
        margin-top: 8px;
        max-width: 200px;
        border-radius: 10px;
    }
    .image-credit {
        font-size: 0.7rem;
        color: #555;
        margin-top: 4px;
    }
    .loading {
        background: #dfe6e9;
        font-style: italic;
        animation: pulse 1s infinite;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0% { opacity: 0.6; } 100% { opacity: 1; } }
    .input-area {
        display: flex;
        padding: 15px;
        background: white;
        border-top: 1px solid #ddd;
        gap: 10px;
    }
    input {
        flex: 1;
        padding: 12px 18px;
        border: 2px solid #6c5ce7;
        border-radius: 50px;
        font-size: 1rem;
        outline: none;
    }
    button {
        background: #fd79a8;
        border: none;
        padding: 0 20px;
        border-radius: 50px;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <img src="https://i.imgur.com/fnMYS0Z.png" alt="Candinho" class="avatar">
        <h2>Candinho</h2>
    </div>
    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="pergunta" placeholder="Ex: O que é dança?" autocomplete="off">
        <button id="sendBtn">Enviar</button>
    </div>
</div>

<script>
    const chatDiv = document.getElementById("chat");
    const inputField = document.getElementById("pergunta");
    const sendBtn = document.getElementById("sendBtn");
    
    let ultimoArtista = null;
    let memoria = {
        nome: localStorage.getItem("candinho_nome") || "",
        idade: localStorage.getItem("candinho_idade") || "",
        ultimoArtista: null
    };

    function addMessageToUI(text, isUser, imageData = null) {
        const div = document.createElement("div");
        div.className = `msg ${isUser ? "user" : "bot"}`;
        
        // Texto principal
        const textSpan = document.createElement("span");
        textSpan.innerText = text;
        div.appendChild(textSpan);
        
        // Se tiver imagem, adiciona abaixo do texto
        if (imageData && imageData.imagemUrl) {
            const img = document.createElement("img");
            img.src = imageData.imagemUrl;
            img.alt = imageData.titulo || "Imagem da obra";
            img.className = "bot-image";
            img.loading = "lazy";
            div.appendChild(img);
            
            const creditSpan = document.createElement("div");
            creditSpan.className = "image-credit";
            creditSpan.innerText = `📷 ${imageData.credito || "Europeana"}`;
            div.appendChild(creditSpan);
        }
        
        chatDiv.appendChild(div);
        chatDiv.scrollTop = chatDiv.scrollHeight;
        return div;
    }

    function addLoading() {
        const div = document.createElement("div");
        div.className = "msg bot loading";
        div.id = "loadingMsg";
        div.innerText = "Candinho está pensando... 🖌️";
        chatDiv.appendChild(div);
        chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    function removeLoading() {
        const el = document.getElementById("loadingMsg");
        if (el) el.remove();
    }

    async function enviarParaBackend(mensagem) {
        try {
            const response = await fetch('/api/groq', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    mensagem: mensagem,
                    memoria: {
                        ...memoria,
                        ultimoArtista: ultimoArtista
                    }
                })
            });
            const data = await response.json();
            
            // Atualiza o último artista
            if (data.artista) ultimoArtista = data.artista;
            
            return {
                texto: data.reply || "Não consegui responder agora.",
                imagem: data.image || null
            };
        } catch (error) {
            console.error("Erro no back-end:", error);
            return {
                texto: "Puxa, derramei a tinta. Tente de novo? 🎨",
                imagem: null
            };
        }
    }

    let isProcessing = false;
    async function enviar() {
        if (isProcessing) return;
        const pergunta = inputField.value.trim();
        if (!pergunta) return;
        
        isProcessing = true;
        sendBtn.disabled = true;
        inputField.disabled = true;
        
        // Mostra pergunta do usuário
        addMessageToUI(pergunta, true);
        inputField.value = "";
        
        addLoading();
        
        const resposta = await enviarParaBackend(pergunta);
        removeLoading();
        
        // Exibe a resposta do bot com a imagem (se houver) em um único bloco
        addMessageToUI(resposta.texto, false, resposta.imagem);
        
        isProcessing = false;
        sendBtn.disabled = false;
        inputField.disabled = false;
        inputField.focus();
    }

    sendBtn.addEventListener("click", enviar);
    inputField.addEventListener("keypress", (e) => { if (e.key === "Enter" && !isProcessing) enviar(); });
    
    // Mensagem de boas-vindas (sem imagem)
    addMessageToUI("Olá! Sou o Candinho, seu amigo artista. Pergunte sobre arte... 🎨", false);
</script>
</body>
</html>
