<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Candinho com Europeana</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #ffeaa7, #81ecec);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
    }
    .container {
        max-width: 800px;
        width: 100%;
        background: white;
        border-radius: 35px;
        box-shadow: 0 20px 35px rgba(0,0,0,0.2);
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }
    .header {
        background: #6c5ce7;
        color: white;
        padding: 20px;
        text-align: center;
    }
    .avatar {
        width: 80px;
        border-radius: 50%;
        border: 3px solid #f9b713;
        margin-bottom: 10px;
    }
    .header h2 { margin: 0; font-size: 1.6rem; }
    #status { font-size: 0.8rem; margin-top: 5px; opacity: 0.9; }
    #chat {
        height: 400px;
        overflow-y: auto;
        background: #f8f9fa;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .msg {
        max-width: 80%;
        padding: 10px 15px;
        border-radius: 20px;
        line-height: 1.4;
        word-wrap: break-word;
        animation: fadeIn 0.2s ease;
    }
    .user {
        background: #74b9ff;
        align-self: flex-end;
        color: #000;
        border-bottom-right-radius: 5px;
    }
    .bot {
        background: #55efc4;
        align-self: flex-start;
        border-bottom-left-radius: 5px;
    }
    .error { background: #ffcccc; align-self: flex-start; border-left: 4px solid #ff0000; }
    .loading {
        background: #dfe6e9;
        font-style: italic;
        animation: pulse 1s infinite;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0% { opacity: 0.6; } 100% { opacity: 1; } }
    .input-area {
        display: flex;
        padding: 15px;
        background: white;
        border-top: 1px solid #ddd;
        gap: 10px;
    }
    input {
        flex: 1;
        padding: 12px 18px;
        border: 2px solid #6c5ce7;
        border-radius: 50px;
        font-size: 1rem;
        outline: none;
    }
    button {
        background: #fd79a8;
        border: none;
        padding: 0 20px;
        border-radius: 50px;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <img src="https://i.imgur.com/fnMYS0Z.png" alt="Candinho" class="avatar">
        <h2>Candinho com Europeana 🎨</h2>
        <div id="status">🔄 Pronto para buscar arte!</div>
    </div>
    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="pergunta" placeholder="Ex: Quem foi Tarsila do Amaral?" autocomplete="off">
        <button id="sendBtn">Enviar</button>
    </div>
</div>

<script>
    // ======================= ELEMENTOS DOM =======================
    const chatDiv = document.getElementById("chat");
    const inputField = document.getElementById("pergunta");
    const sendBtn = document.getElementById("sendBtn");
    const statusDiv = document.getElementById("status");

    // ======================= ACERVO LOCAL DE ARTISTAS (fallback) =======================
    const artistasLocal = {
        "tarsila do amaral": {
            nome: "Tarsila do Amaral",
            resposta: "🎨 Tarsila do Amaral foi uma das mais importantes pintoras brasileiras! Ela criou o quadro 'Abaporu' e ajudou a fundar o movimento modernista no Brasil. 🇧🇷"
        },
        "portinari": {
            nome: "Candido Portinari",
            resposta: "🖌️ Portinari foi um pintor brasileiro que retratou a vida do povo brasileiro. Suas obras mais famosas mostram crianças brincando, trabalhadores e a cultura do Brasil! ☕"
        },
        "van gogh": {
            nome: "Van Gogh",
            resposta: "🌻 Van Gogh foi um pintor holandês famoso por suas cores vibrantes e pinceladas marcantes. A obra mais famosa dele é 'Noite Estrelada'! ✨"
        },
        "monet": {
            nome: "Claude Monet",
            resposta: "🏞️ Monet foi um pintor francês, criador do movimento impressionista. Adorava pintar jardins, nenúfares e a luz do sol refletindo na água! 🪷"
        },
        "picasso": {
            nome: "Pablo Picasso",
            resposta: "🔲 Picasso foi um artista espanhol que criou o Cubismo, onde as figuras aparecem com formas geométricas! Uma obra famosa é 'Guernica'. 🎭"
        },
        "frida kahlo": {
            nome: "Frida Kahlo",
            resposta: "🌺 Frida Kahlo foi uma artista mexicana famosa por seus autorretratos cheios de cor e emoção. Ela pintava sobre sua vida, dores e a cultura do México! 🦜"
        },
        "leonardo da vinci": {
            nome: "Leonardo da Vinci",
            resposta: "🎭 Leonardo da Vinci foi um gênio do Renascimento! Além de pintar a Mona Lisa, ele também foi inventor, cientista e engenheiro. ✏️"
        }
    };

    // ======================= FUNÇÃO: buscar artista localmente =======================
    function buscarArtistaLocal(nome) {
        const nomeNorm = nome.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        for (const [chave, dados] of Object.entries(artistasLocal)) {
            if (nomeNorm.includes(chave) || chave.includes(nomeNorm)) {
                return dados.resposta;
            }
        }
        return null;
    }

    // ======================= FUNÇÃO: extrair nome da pergunta (quem foi/é ...) =======================
    function extrairNomeArtista(pergunta) {
        const match = pergunta.match(/quem (foi|é)\s+([A-Za-zÀ-ÖØ-öø-ÿ\s]+)/i);
        if (match && match[2]) {
            return match[2].trim().replace(/[?!.,]+$/, '');
        }
        return null;
    }

    // ======================= FUNÇÕES DE UI =======================
    function addMessageToUI(text, isUser, isError = false) {
        const div = document.createElement("div");
        div.className = `msg ${isUser ? "user" : "bot"} ${isError ? "error" : ""}`;
        div.innerText = text;
        chatDiv.appendChild(div);
        chatDiv.scrollTop = chatDiv.scrollHeight;
        return div;
    }

    function addLoading() {
        const div = document.createElement("div");
        div.className = "msg bot loading";
        div.id = "loadingMsg";
        div.innerText = "Candinho está pensando... 🖌️";
        chatDiv.appendChild(div);
        chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    function removeLoading() {
        const el = document.getElementById("loadingMsg");
        if (el) el.remove();
    }

    // ======================= FUNÇÃO: ADICIONAR IMAGEM AO CHAT (Passo 4) =======================
    function adicionarImagemAoChat(imagemUrl, titulo, credito) {
        const div = document.createElement('div');
        div.className = 'msg bot';
        div.innerHTML = `
            <div>🖼️ <strong>${titulo}</strong></div>
            <img src="${imagemUrl}" alt="${titulo}" style="max-width: 200px; border-radius: 10px; margin: 5px 0;">
            <div style="font-size: 0.7rem; color: #666;">📷 Fonte: ${credito}</div>
        `;
        chatDiv.appendChild(div);
        chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    // ======================= FUNÇÃO: CHAMAR API EUROPEANA (Passo 4) =======================
    async function buscarNaEuropeana(termo) {
        try {
            console.log('🔍 Buscando na Europeana:', termo);
            const resposta = await fetch('/api/europeana', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    termo: termo,
                    tipo: 'artista'
                })
            });
            const dados = await resposta.json();
            console.log('📦 Resposta da Europeana:', dados);
            
            if (dados.encontrado && dados.obra) {
                return {
                    sucesso: true,
                    mensagem: dados.reply,
                    imagem: dados.obra.imagem,
                    titulo: dados.obra.titulo,
                    credito: dados.obra.credito
                };
            }
            return {
                sucesso: false,
                mensagem: dados.reply || 'Não encontrei obras desse artista na Europeana.'
            };
        } catch (erro) {
            console.error('❌ Erro ao chamar Europeana:', erro);
            return {
                sucesso: false,
                mensagem: 'Estou com dificuldades técnicas. Tente novamente! 🎨'
            };
        }
    }

    // ======================= FUNÇÃO RESPONDER (com fallback local e Europeana) =======================
    async function responder(pergunta) {
        // 1. Verificar se é uma pergunta sobre artista ("quem foi...")
        let nomeArtista = extrairNomeArtista(pergunta);
        
        // Se não for, tenta extrair palavras soltas (ex: "Tarsila")
        if (!nomeArtista) {
            const palavras = pergunta.split(/\s+/);
            for (let p of palavras) {
                if (p.length > 3 && artistasLocal[p.toLowerCase()]) {
                    nomeArtista = p;
                    break;
                }
            }
        }
        
        // 2. Buscar no acervo local (fallback rápido)
        const respostaLocal = nomeArtista ? buscarArtistaLocal(nomeArtista) : null;
        if (respostaLocal) {
            return respostaLocal + " 🦆✨";
        }
        
        // 3. Se não encontrou localmente e tem um nome, tentar na Europeana
        if (nomeArtista) {
            const resultado = await buscarNaEuropeana(nomeArtista);
            if (resultado.sucesso) {
                // Mostrar a mensagem textual
                addMessageToUI(resultado.mensagem, false);
                // Pequeno atraso para não misturar com a imagem (opcional)
                setTimeout(() => {
                    if (resultado.imagem) {
                        adicionarImagemAoChat(resultado.imagem, resultado.titulo, resultado.credito);
                    }
                }, 300);
                return; // já adicionamos a mensagem, não precisa retornar mais nada
            } else {
                return resultado.mensagem + " Que tal perguntar sobre Tarsila, Portinari ou Van Gogh? 🎨";
            }
        }
        
        // 4. Se a pergunta não for sobre artista, responder de forma genérica
        const perguntaLower = pergunta.toLowerCase();
        if (perguntaLower.includes("oi") || perguntaLower.includes("olá")) {
            return "Olá! Sou o Candinho, seu amigo artista! Pergunte 'Quem foi Tarsila do Amaral?' ou sobre outros artistas! 🎨✨";
        }
        if (perguntaLower.includes("obrigado")) {
            return "Por nada! Fico feliz em ajudar você a descobrir o mundo da arte! 🦆💛";
        }
        if (perguntaLower.includes("ajuda")) {
            return "Posso te contar sobre artistas famosos! Tente perguntar: 'Quem foi Tarsila do Amaral?' ou 'Quem foi Van Gogh?' 🎭";
        }
        
        return "Ainda não aprendi sobre isso. Pergunte sobre artistas como Tarsila, Portinari, Van Gogh, Monet, Picasso ou Frida Kahlo! 🦆✨";
    }

    // ======================= CONTROLE DE ENVIO =======================
    let isProcessing = false;
    async function enviar() {
        if (isProcessing) return;
        const texto = inputField.value.trim();
        if (!texto) return;
        isProcessing = true;
        sendBtn.disabled = true;
        inputField.disabled = true;
        addMessageToUI(texto, true);
        inputField.value = "";
        addLoading();
        try {
            const resposta = await responder(texto);
            removeLoading();
            // Se a responder já tiver adicionado mensagem (caso Europeana com imagem), não adicionar novamente
            if (resposta) {
                addMessageToUI(resposta, false);
            }
        } catch (err) {
            removeLoading();
            addMessageToUI("Ops! Ocorreu um erro inesperado.", false, true);
            console.error(err);
        } finally {
            isProcessing = false;
            sendBtn.disabled = false;
            inputField.disabled = false;
            inputField.focus();
        }
    }

    sendBtn.addEventListener("click", enviar);
    inputField.addEventListener("keypress", (e) => { if (e.key === "Enter" && !isProcessing) enviar(); });

    // Mensagem inicial
    statusDiv.innerText = "🎨 Candinho conectado à Europeana!";
    addMessageToUI("Olá! Sou o Candinho. Pergunte 'Quem foi Tarsila do Amaral?' e, se o artista não estiver no meu acervo local, vou buscar imagens na Europeana para você! 🖼️", false);
</script>
</body>
</html>
