<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #ffeaa7, #81ecec);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
    }
    .container {
        max-width: 800px;
        width: 100%;
        background: white;
        border-radius: 35px;
        box-shadow: 0 20px 35px rgba(0,0,0,0.2);
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }
    .header {
        background: #6c5ce7;
        color: white;
        padding: 20px;
        text-align: center;
    }
    .avatar {
        width: 80px;
        border-radius: 50%;
        border: 3px solid #f9b713;
        margin-bottom: 10px;
    }
    .header h2 {
        margin: 0;
        font-size: 1.6rem;
    }
    #status {
        font-size: 0.8rem;
        margin-top: 5px;
        opacity: 0.9;
    }
    #chat {

        overflow-y: auto;
        background: #f8f9fa;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .msg {
        max-width: 80%;
        padding: 10px 15px;
        border-radius: 20px;
        line-height: 1.4;
        word-wrap: break-word;
        animation: fadeIn 0.2s ease;
    }
    .user {
        background: #74b9ff;
        align-self: flex-end;
        color: #000;
        border-bottom-right-radius: 5px;
    }
    .bot {
        background: #55efc4;

        border-bottom-left-radius: 5px;
    }
    .error {
        background: #ffcccc;
        align-self: flex-start;
        border-left: 4px solid #ff0000;
    }
    .loading {
        background: #dfe6e9;
        font-style: italic;
        animation: pulse 1s infinite;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0% { opacity: 0.6; } 100% { opacity: 1; } }
    .input-area {
        display: flex;
        padding: 15px;
        background: white;
        border-top: 1px solid #ddd;
        gap: 10px;
    }
    input {
        flex: 1;
        padding: 12px 18px;
        border: 2px solid #6c5ce7;
        border-radius: 50px;
        font-size: 1rem;
        outline: none;
    }
    button {
        background: #fd79a8;
        border: none;
        padding: 0 20px;
        border-radius: 50px;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }
    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
</style>

<script type="module">

    let dataStore = {};
    let ultimoPersonagem = null;
    let historicoMensagens = [];
    let nomeUsuario = localStorage.getItem("candinho_nome") || "";
    let conversaId = localStorage.getItem("candinho_conversaId");
    if (!conversaId) {
        conversaId = `sessao_${Date.now()}`;

    const chatDiv = document.getElementById("chat");

    function addMessageToUI(text, isUser, isError = false) {
        const div = document.createElement("div");
        div.className = `msg ${isUser ? "user" : "bot"} ${isError ? "error" : ""}`;
        div.innerText = text;
        chatDiv.appendChild(div);

    function extrairMemoria(pergunta) {
        const texto = pergunta.toLowerCase();
        const nomeMatch = pergunta.match(/(?:meu nome é|sou|chamo(-me)?|chamado de) ([A-Za-zÀ-ÖØ-öø-ÿ]+)/i);
        if (nomeMatch && nomeMatch[2]) {
            let novoNome = nomeMatch[2].trim();
            novoNome = novoNome.charAt(0).toUpperCase() + novoNome.slice(1).toLowerCase();
            memoria.nome = novoNome;
            localStorage.setItem("candinho_nome", memoria.nome);
            return `Prazer, ${memoria.nome}! Vou lembrar de você 😊`;
        }
        const idadeMatch = pergunta.match(/(\d{1,2}) anos/);
        if (idadeMatch) {
            memoria.idade = idadeMatch[1];
            localStorage.setItem("candinho_idade", memoria.idade);
            return `Legal! Você tem ${memoria.idade} anos 🎈`;
        }
        const interesses = ["desenhar", "pintar", "dançar", "música", "teatro"];
        for (let interesse of interesses) {
            if (texto.includes(interesse)) {
                if (!memoria.interesses.includes(interesse)) {
                    memoria.interesses.push(interesse);
                    localStorage.setItem("candinho_interesses", JSON.stringify(memoria.interesses));
                    return `Que legal que você gosta de ${interesse}! 🎨`;
                }
            }
        }
        return null;
    }
    
    function addLoading() {

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    
    const firebaseConfig = {
        apiKey: "AIzaSyCQq1DYHivZBIX2_0_NY7eKIoBWG5sKs48",
        authDomain: "candinho-8bee5.firebaseapp.com",
        projectId: "candinho-8bee5",
        storageBucket: "candinho-8bee5.firebasestorage.app",
        messagingSenderId: "342319000222",
        appId: "1:342319000222:web:ab04b940b0175b8722a98f"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    async function salvarMensagemFirebase(role, content) { return; }
    async function carregarHistoricoFirebase() {
        historicoMensagens = [];
        statusDiv.innerText = "✅ Candinho pronto";
        return;
    }
    
    function normalizar(texto) {
        return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    }
    
    let contexto = { personagem: null, tema: null, ultimaPergunta: null };
    
    function buscarEmJSON(jsonObj, pergunta) {
        if (!jsonObj || typeof jsonObj !== "object") return null;
        const textoNorm = normalizar(pergunta);
        
        function montarResposta(item) {
            let partes = [];
            if (item.inicio?.[0]) partes.push(item.inicio[0]);
            if (item.explicacao_curta?.[0]) partes.push(item.explicacao_curta[0]);
            if (item.explicacao_aprofundada?.[0]) partes.push(item.explicacao_aprofundada[0]);
            if (item.curiosidade?.[0]) partes.push(item.curiosidade[0]);
            if (item.interacao?.[0]) partes.push(item.interacao[0]);
            if (item.atividade?.[0]) partes.push(item.atividade[0]);
            if (item.final?.[0]) partes.push(item.final[0]);
            if (partes.length === 0 && typeof item.explicacao_infantil === "string") partes.push(item.explicacao_infantil);
            if (partes.length === 0 && typeof item.resposta === "string") partes.push(item.resposta);
            return partes.join("\n\n").trim();
        }
        
        function buscarRecursivo(obj) {
            if (!obj || typeof obj !== "object") return null;
            for (const chave in obj) {
                const item = obj[chave];
                if (item && typeof item === "object" && Array.isArray(item.palavras_chave)) {
                    const encontrou = item.palavras_chave.some(p => textoNorm.includes(normalizar(p)));
                    if (encontrou) {
                        contexto.personagem = chave;
                        contexto.ultimaPergunta = pergunta;
                        ultimoPersonagem = chave;
                        const resposta = montarResposta(item);
                        if (resposta && resposta.trim().length > 0) return resposta;
                    }
                }
                if (item && typeof item === "object") {
                    const resultado = buscarRecursivo(item);
                    if (resultado) return resultado;
                }
            }
            return null;
        }
        return buscarRecursivo(jsonObj);
    }
    
    // Mapeamento de nomes comuns para as chaves do JSON
    const mapaNomes = {
        "leonardo da vinci": "leonardo_da_vinci",
        "leonardo": "leonardo_da_vinci",
        "michelangelo": "michelangelo",
        "van gogh": "vincent_van_gogh",
        "vincent van gogh": "vincent_van_gogh",
        "picasso": "pablo_picasso",
        "pablo picasso": "pablo_picasso",
        "dali": "salvador_dali",
        "salvador dali": "salvador_dali",
        "frida": "frida_kahlo",
        "frida kahlo": "frida_kahlo",
        "monet": "claude_monet",
        "claude monet": "claude_monet",
        "matisse": "henri_matisse",
        "henri matisse": "henri_matisse",
        "portinari": "candido_portinari",
        "tarsila": "tarsila_do_amaral",
        "tarsila do amaral": "tarsila_do_amaral"
    };
    
    function buscarArtistaPorNome(nomeBuscado) {
        const nomeNorm = normalizar(nomeBuscado);
        const fontesArtistas = [
            dataStore.artistas,
            dataStore.artistas_universais,
            dataStore.artistas_indigenas_afrobrasileiros,
            dataStore.artistas_mulheres_historicas
        ];
        
        // Tenta pelo mapeamento direto
        let chaveDireta = mapaNomes[nomeNorm];
        if (chaveDireta) {
            for (const fonte of fontesArtistas) {
                if (fonte && fonte[chaveDireta]) return { fonte, chave: chaveDireta, dados: fonte[chaveDireta] };
            }
        }
        
        // Busca por similaridade na chave
        for (const fonte of fontesArtistas) {
            if (!fonte) continue;
            for (const [chave, dados] of Object.entries(fonte)) {
                const chaveNorm = chave.toLowerCase().replace(/_/g, ' ');
                if (chaveNorm.includes(nomeNorm) || nomeNorm.includes(chaveNorm)) {
                    return { fonte, chave, dados };
                }
                if (dados.palavras_chave && dados.palavras_chave.some(p => normalizar(p).includes(nomeNorm))) {
                    return { fonte, chave, dados };
                }
            }
        }
        return null;
    }
    
    // Extrai nome de perguntas como "Quando nasceu Leonardo da Vinci?" ou "Onde morreu Michelangelo?"
    function extrairNomeDaPergunta(pergunta) {
        // Padrões: "Quando nasceu X?", "Onde nasceu X?", "Em que ano nasceu X?", "Quando morreu X?", etc.
        const padroes = [
            /quando nasceu\s+([A-Za-zÀ-ÖØ-öø-ÿ\s]+)/i,
            /onde nasceu\s+([A-Za-zÀ-ÖØ-öø-ÿ\s]+)/i,
            /em que ano nasceu\s+([A-Za-zÀ-ÖØ-öø-ÿ\s]+)/i,
            /ano de nascimento de\s+([A-Za-zÀ-ÖØ-öø-ÿ\s]+)/i,
            /quando morreu\s+([A-Za-zÀ-ÖØ-öø-ÿ\s]+)/i,
            /em que ano morreu\s+([A-Za-zÀ-ÖØ-öø-ÿ\s]+)/i,
            /onde morreu\s+([A-Za-zÀ-ÖØ-öø-ÿ\s]+)/i,
            /o que (ele|ela) fez\s+([A-Za-zÀ-ÖØ-öø-ÿ\s]+)/i,
            /o que (ele|ela) criou\s+([A-Za-zÀ-ÖØ-öø-ÿ\s]+)/i
        ];
        for (const padrao of padroes) {
            const match = pergunta.match(padrao);
            if (match) {
                let nome = match[1] || match[2];
                if (nome) return nome.trim().replace(/[?!.,]+$/, '');
            }
        }
        return null;
    }
    
    async function responder(pergunta) {
        const txt = normalizar(pergunta);
        
        // ============================================================
        // 0. TENTA EXTRAIR NOME DE PERGUNTAS CONTEXTUAIS DIRETAS
        //    Ex: "Quando nasceu Leonardo da Vinci?" -> atualiza ultimoPersonagem
        // ============================================================
        const nomeExtraido = extrairNomeDaPergunta(pergunta);
        if (nomeExtraido) {
            const artista = buscarArtistaPorNome(nomeExtraido);
            if (artista) {
                ultimoPersonagem = artista.chave;
            }
        }
        
        // ============================================================
        // 1. PERGUNTAS CONTEXTUAIS SOBRE O ÚLTIMO PERSONAGEM
        // ============================================================
        if (ultimoPersonagem) {
            let personagemData = null;
            const fontesArtistas = [
                dataStore.artistas,
                dataStore.artistas_universais,
                dataStore.artistas_indigenas_afrobrasileiros,
                dataStore.artistas_mulheres_historicas
            ];
            for (const fonte of fontesArtistas) {
                if (fonte && fonte[ultimoPersonagem]) {
                    personagemData = fonte[ultimoPersonagem];
                    break;
                }
            }
            
            if (personagemData) {
                const nomeArtista = ultimoPersonagem.replace(/_/g, ' ').split(' ').map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' ');
                
                // O que ele fez?
                if (txt.includes("o que ele fez") || txt.includes("o que ela fez") || 
                    txt.includes("o que criou") || txt.includes("o que pintou") ||
                    txt.includes("o que fez") || (txt.includes("fez") && !txt.includes("nasceu") && !txt.includes("morreu"))) {
                    if (personagemData.o_que_ele_fez && Array.isArray(personagemData.o_que_ele_fez)) {
                        const resposta = personagemData.o_que_ele_fez.join(' ');
                        historicoMensagens.push({ role: "user", content: pergunta });
                        historicoMensagens.push({ role: "assistant", content: resposta });
                        return resposta;
                    }
                }
                // Em que ano nasceu?
                if (txt.includes("ano nasceu") || txt.includes("ano de nascimento") || txt.includes("quando nasceu") || txt.includes("nasceu em que ano") || (txt.includes("nasceu") && !txt.includes("onde"))) {
                    if (personagemData.ano_nascimento) {
                        const resposta = `${nomeArtista} nasceu no ano de ${personagemData.ano_nascimento}.`;
                        historicoMensagens.push({ role: "user", content: pergunta });
                        historicoMensagens.push({ role: "assistant", content: resposta });
                        return resposta;
                    }
                }
                // Onde nasceu?
                if (txt.includes("onde nasceu") || txt.includes("local de nascimento")) {
                    if (personagemData.local_nascimento) {
                        const resposta = `${nomeArtista} nasceu em ${personagemData.local_nascimento}.`;
                        historicoMensagens.push({ role: "user", content: pergunta });
                        historicoMensagens.push({ role: "assistant", content: resposta });
                        return resposta;
                    }
                }
                // Em que ano morreu? / faleceu
                if (txt.includes("ano morreu") || txt.includes("morreu em que ano") || txt.includes("quando morreu") || txt.includes("faleceu")) {
                    if (personagemData.ano_falecimento) {
                        const resposta = `${nomeArtista} faleceu no ano de ${personagemData.ano_falecimento}.`;
                        historicoMensagens.push({ role: "user", content: pergunta });
                        historicoMensagens.push({ role: "assistant", content: resposta });
                        return resposta;
                    }
                }
                // Onde morreu?
                if (txt.includes("onde morreu")) {
                    if (personagemData.local_falecimento) {
                        const resposta = `${nomeArtista} faleceu em ${personagemData.local_falecimento}.`;
                        historicoMensagens.push({ role: "user", content: pergunta });
                        historicoMensagens.push({ role: "assistant", content: resposta });
                        return resposta;
                    }
                }
            }
        }
        
        // ============================================================
        // 2. TRATAMENTO ESPECIAL PARA "QUEM FOI X?" ou "QUEM É X?"
        // ============================================================
        const quemMatch = pergunta.match(/quem (foi|é)\s+([A-Za-zÀ-ÖØ-öø-ÿ\s]+)/i);
        if (quemMatch) {
            let nomeBuscado = quemMatch[2].trim();
            nomeBuscado = nomeBuscado.replace(/[?!.,]+$/, '');
            
            const resultado = buscarArtistaPorNome(nomeBuscado);
            if (resultado && resultado.dados) {
                let resposta = '';
                if (resultado.dados.inicio?.[0]) resposta += resultado.dados.inicio[0] + '\n\n';
                if (resultado.dados.explicacao_curta?.[0]) resposta += resultado.dados.explicacao_curta[0] + '\n\n';
                if (resultado.dados.curiosidade?.[0]) resposta += resultado.dados.curiosidade[0];
                if (!resposta && resultado.dados.explicacao_infantil) resposta = resultado.dados.explicacao_infantil;
                if (!resposta && resultado.dados.resposta) resposta = resultado.dados.resposta;
                if (resposta) {
                    ultimoPersonagem = resultado.chave;
                    historicoMensagens.push({ role: "user", content: pergunta });
                    historicoMensagens.push({ role: "assistant", content: resposta });
                    return resposta;
                }
            }
            const naoAchei = `Ainda não aprendi sobre ${nomeBuscado} 😅. Pode me ensinar? Ou pergunte sobre outro artista!`;
            historicoMensagens.push({ role: "user", content: pergunta });
            historicoMensagens.push({ role: "assistant", content: naoAchei });
            return naoAchei;
        }
        
        // ============================================================
        // 3. PERGUNTA "QUEM FOI?" (sem nome) - usa último personagem
        // ============================================================
        if ((txt === "quem foi" || txt === "quem foi?") && ultimoPersonagem) {
            for (const chave in dataStore) {
                const obj = dataStore[chave];
                const resposta = buscarEmJSON(obj, ultimoPersonagem);
                if (resposta) {
                    historicoMensagens.push({ role: "user", content: pergunta });
                    historicoMensagens.push({ role: "assistant", content: resposta });
                    return resposta;
                }
            }
        }
        
        // ============================================================
        // 4. MEMÓRIA
        // ============================================================
        const memoriaDetectada = extrairMemoria(pergunta);
        if (memoriaDetectada) {
            historicoMensagens.push({ role: "user", content: pergunta });
            historicoMensagens.push({ role: "assistant", content: memoriaDetectada });
            return memoriaDetectada;
        }
        
        if (pergunta.toLowerCase().includes("meu nome")) {
            return memoria.nome ? `Seu nome é ${memoria.nome}! 😊` : "Você ainda não me contou seu nome!";
        }
        if (pergunta.toLowerCase().includes("quantos anos eu tenho")) {
            return memoria.idade ? `Você tem ${memoria.idade} anos! 🎈` : "Você ainda não me contou sua idade!";
        }
        
        // ============================================================
        // 5. RESPOSTA DOS JSONS (busca geral)
        // ============================================================
        for (const chave of Object.keys(dataStore)) {
            const obj = dataStore[chave];
            if (obj) {
                const resposta = buscarEmJSON(obj, pergunta);
                if (resposta && typeof resposta === "string" && resposta.trim().length > 0) {
                    historicoMensagens.push({ role: "user", content: pergunta });
                    historicoMensagens.push({ role: "assistant", content: resposta });
                    return resposta;
                }
            }
        }
        
        // ============================================================
        // 6. FALLBACK
        // ============================================================
        return "Ainda não aprendi sobre isso. Tente perguntar de outra forma ou pergunte sobre um artista! 🎨";
    }
    
    async function carregarTodosJSONs() {
        statusDiv.innerText = "📥 Baixando respostas instantâneas...";
        const promises = [];
        for (const [key, filename] of Object.entries(jsonFiles)) {
            const url = GITHUB_BASE + filename;
            promises.push(
                fetch(url)
                    .then(res => res.ok ? res.json() : (console.warn(`Arquivo ${filename} não encontrado`), {}))
                    .catch(err => { console.warn(`Erro ${filename}:`, err); return {}; })
            );
        }
        const resultados = await Promise.all(promises);
        let idx = 0;
        for (const key of Object.keys(jsonFiles)) {
            dataStore[key] = resultados[idx++];
        }
        const carregados = Object.keys(dataStore).filter(k => Object.keys(dataStore[k]).length > 0);
        console.log("JSONs carregados:", carregados);
        statusDiv.innerText = carregados.length ? "🎨 Candinho pronto!" : "⚠️ Respostas instantâneas indisponíveis";
    }
    
    let isProcessing = false;
    async function enviar() {
        if (isProcessing) return;
        const texto = inputField.value.trim();
        if (!texto) return;
        isProcessing = true;
        sendBtn.disabled = true;
        inputField.disabled = true;
        addMessageToUI(texto, true);
        inputField.value = "";
        addLoading();
        try {
            const resposta = await responder(texto);
            removeLoading();
            addMessageToUI(resposta, false);
        } catch (err) {
            removeLoading();
            addMessageToUI("Ops! Ocorreu um erro inesperado.", false, true);
            console.error(err);
        } finally {
            isProcessing = false;
            sendBtn.disabled = false;
            inputField.disabled = false;
            inputField.focus();
        }
    }
    
    sendBtn.addEventListener("click", enviar);
    inputField.addEventListener("keypress", (e) => { if (e.key === "Enter" && !isProcessing) enviar(); });
    
    async function init() {
        await carregarTodosJSONs();
        historicoMensagens = [];
        let boasVindas = "Olá! Sou o Candinho, seu amigo artista. Pergunte sobre artistas, artes...! 🖌️";
        if (nomeUsuario) boasVindas = `Olá, ${nomeUsuario}! Sou o Candinho, seu amigo artista. Vamos criar? 🎨`;
        addMessageToUI(boasVindas, false);
        historicoMensagens.push({ role: "assistant", content: boasVindas });
    }
    
    init().catch(err => {
        console.error(err);
        statusDiv.innerText = "Erro crítico ao iniciar.";
        addMessageToUI("Não foi possível carregar os conhecimentos do Candinho. Verifique a conexão.", false, true);
    });
</script>
</body>
</html>
