<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Candinho</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #ffeaa7, #81ecec);
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .container {
        width: 100%;
        height: 100vh;
        background: white;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    /* sem header fixo */
    #chat {
        flex: 1;
        overflow-y: auto;
        background: #f8f9fa;
        padding: 20px 15px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .msg {
        max-width: 80%;
        padding: 10px 15px;
        border-radius: 20px;
        word-wrap: break-word;
        animation: fadeIn 0.2s ease;
    }
    .user {
        background: #74b9ff;
        align-self: flex-end;
        color: #000;
        border-bottom-right-radius: 5px;
    }
    .bot {
        background: #55efc4;
        align-self: flex-start;
        border-bottom-left-radius: 5px;
    }
    /* avatar na mensagem do bot (saudação) */
    .bot-avatar-wrapper {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .bot-avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
    }
    /* imagem da obra */
    .bot-image {
        margin-top: 12px;
        max-width: 100%;
        width: auto;
        border-radius: 16px;
        cursor: zoom-in;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        display: block;
    }
    .bot-image:hover {
        transform: scale(1.02);
        box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
    .image-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.9);
        z-index: 10000;
        justify-content: center;
        align-items: center;
        cursor: zoom-out;
    }
    .image-modal img {
        max-width: 90%;
        max-height: 90%;
        object-fit: contain;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        animation: zoomFadeIn 0.2s ease;
    }
    .image-modal .modal-caption {
        position: absolute;
        bottom: 20px;
        left: 0;
        right: 0;
        text-align: center;
        color: white;
        background: rgba(0,0,0,0.6);
        padding: 8px;
        font-size: 0.8rem;
    }
    @keyframes zoomFadeIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
    }
    .image-credit {
        font-size: 0.65rem;
        color: #666;
        margin-top: 5px;
        text-align: center;
    }
    .loading {
        background: #dfe6e9;
        font-style: italic;
        animation: pulse 1s infinite;
    }
    @keyframes fadeIn { 
        from { opacity: 0; transform: translateY(5px); } 
        to { opacity: 1; transform: translateY(0); } 
    }
    @keyframes pulse { 
        0% { opacity: 0.6; } 
        100% { opacity: 1; } 
    }
    .input-area {
        display: flex;
        padding: 15px;
        background: white;
        border-top: 1px solid #ddd;
        gap: 10px;
        flex-shrink: 0;
    }
    input {
        flex: 1;
        padding: 12px 18px;
        border: 2px solid #6c5ce7;
        border-radius: 50px;
        font-size: 1rem;
        outline: none;
    }
    button {
        background: #fd79a8;
        border: none;
        padding: 0 25px;
        border-radius: 50px;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.1s ease;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    #chat::-webkit-scrollbar {
        width: 6px;
    }
    #chat::-webkit-scrollbar-track {
        background: #e0e0e0;
        border-radius: 10px;
    }
    #chat::-webkit-scrollbar-thumb {
        background: #6c5ce7;
        border-radius: 10px;
    }
    @media (max-width: 600px) {
        .msg { max-width: 90%; }
        .bot-image { max-width: 100%; }
        .bot-avatar { width: 36px; height: 36px; }
    }
</style>
</head>
<body>
<div class="container">
    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="pergunta" placeholder="Ex: Quem foi Tarsila do Amaral?" autocomplete="off" autofocus>
        <button id="sendBtn">Enviar</button>
    </div>
</div>

<!-- Modal para zoom -->
<div id="imageModal" class="image-modal" onclick="closeImageModal()">
    <img id="modalImage" src="" alt="">
    <div class="modal-caption" id="modalCaption"></div>
</div>

<script>
const chatDiv = document.getElementById("chat");
const inputField = document.getElementById("pergunta");
const sendBtn = document.getElementById("sendBtn");

let ultimoArtista = null;
let memoria = {
    nome: localStorage.getItem("candinho_nome") || "",
    idade: localStorage.getItem("candinho_idade") || "",
    ultimoArtista: null
};

function openImageModal(imgSrc, caption) {
    const modal = document.getElementById("imageModal");
    const modalImg = document.getElementById("modalImage");
    const modalCaption = document.getElementById("modalCaption");
    modalImg.src = imgSrc;
    modalCaption.innerText = caption || "Obra de arte";
    modal.style.display = "flex";
    document.body.style.overflow = "hidden";
}

function closeImageModal() {
    const modal = document.getElementById("imageModal");
    modal.style.display = "none";
    document.body.style.overflow = "";
}

document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeImageModal();
});

// Função de mensagem (agora sem header, só o chat)
function addMessageToUI(text, isUser, imageData = null) {
    const div = document.createElement("div");
    div.className = `msg ${isUser ? "user" : "bot"}`;

    // Verifica se é a saudação do bot (para incluir o avatar inline)
    const isSaudacao = !isUser && typeof text === "string" && text.includes("Sou o Candinho");

    if (isSaudacao) {
        const wrapper = document.createElement("div");
        wrapper.className = "bot-avatar-wrapper";

        const avatar = document.createElement("img");
        avatar.src = "https://i.imgur.com/UDl1c5j.png"; // avatar do Candinho (mesmo do Quinti)
        avatar.alt = "Candinho";
        avatar.className = "bot-avatar";

        const texto = document.createElement("span");
        texto.innerText = text;
        texto.style.whiteSpace = "pre-wrap";

        wrapper.appendChild(avatar);
        wrapper.appendChild(texto);
        div.appendChild(wrapper);
    } else {
        const textSpan = document.createElement("span");
        textSpan.style.whiteSpace = "pre-wrap";
        textSpan.innerText = text;
        div.appendChild(textSpan);
    }

    // Adiciona imagem da Europeana se existir
    if (imageData && imageData.imagemUrl) {
        const imgContainer = document.createElement("div");
        imgContainer.style.marginTop = "10px";

        const img = document.createElement("img");
        img.src = imageData.imagemUrl;
        img.alt = imageData.titulo || "Imagem da obra";
        img.className = "bot-image";
        img.loading = "lazy";
        img.title = "Clique para ampliar";

        img.addEventListener("click", (e) => {
            e.stopPropagation();
            const highResUrl = imageData.imagemGrande || imageData.imagemUrl;
            openImageModal(highResUrl, imageData.titulo || `Obra de ${imageData.credito || "artista"}`);
        });

        imgContainer.appendChild(img);

        const creditSpan = document.createElement("div");
        creditSpan.className = "image-credit";
        creditSpan.innerText = `📷 ${imageData.credito || "Europeana"} • Clique na imagem para ampliar`;

        imgContainer.appendChild(creditSpan);
        div.appendChild(imgContainer);
    }

    chatDiv.appendChild(div);
    chatDiv.scrollTop = chatDiv.scrollHeight;
    return div;
}

function addLoading() {
    const div = document.createElement("div");
    div.className = "msg bot loading";
    div.id = "loadingMsg";
    div.innerText = "Candinho está pensando... 🎨";
    chatDiv.appendChild(div);
    chatDiv.scrollTop = chatDiv.scrollHeight;
}

function removeLoading() {
    const el = document.getElementById("loadingMsg");
    if (el) el.remove();
}

async function enviarParaBackend(mensagem) {
    try {
        const response = await fetch("/api/groq", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                mensagem: mensagem,
                memoria: { ...memoria, ultimoArtista: ultimoArtista }
            })
        });
        if (!response.ok) throw new Error(`Erro: ${response.status}`);
        const data = await response.json();
        if (data.artista) {
            ultimoArtista = data.artista;
            memoria.ultimoArtista = ultimoArtista;
        }
        return {
            texto: data.reply || "Acho que me distraí com uma pintura! Pode repetir? 🎨",
            imagem: data.image || null
        };
    } catch (error) {
        console.error(error);
        return {
            texto: "Puxa, derramei minhas tintas! Tente me perguntar de novo? 🎨",
            imagem: null
        };
    }
}

let isProcessing = false;
async function enviar() {
    const pergunta = inputField.value.trim();
    if (!pergunta || isProcessing) return;
    isProcessing = true;
    sendBtn.disabled = true;
    inputField.disabled = true;

    addMessageToUI(pergunta, true);
    inputField.value = "";
    addLoading();

    const resposta = await enviarParaBackend(pergunta);
    removeLoading();
    addMessageToUI(resposta.texto, false, resposta.imagem);

    isProcessing = false;
    sendBtn.disabled = false;
    inputField.disabled = false;
    inputField.focus();
}

sendBtn.addEventListener("click", enviar);
inputField.addEventListener("keypress", (e) => {
    if (e.key === "Enter") {
        e.preventDefault();
        enviar();
    }
});

// Saudação inicial (agora sem header, só a mensagem com avatar inline)
const saudacaoInicial = memoria.nome
    ? `Olá, ${memoria.nome}! Sou o Candinho, seu amigo artista.`
    : `Olá! Sou o Candinho, seu amigo artista.`;

addMessageToUI(saudacaoInicial, false);
</script>
</body>
</html>
