<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Candinho - Artista Amigo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white; 
            padding: 15px; 
            display: flex; 
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container { 
            width: 100%; 
            max-width: 800px;
            background: rgba(22, 33, 62, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 25px; 
            box-shadow: 0 15px 50px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 215, 0, 0.2);
            display: flex;
            flex-direction: column;
        }
        
        .header { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            margin-bottom: 20px; 
            padding-bottom: 15px; 
            border-bottom: 2px solid #e94560; 
        }
        
        .avatar { 
            width: 70px;
            height: 70px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 3px solid #ffd700;
            animation: float 4s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        
        .title h1 { font-size: 1.8rem; letter-spacing: 1px; }
        .title small { color: #ffd700; font-style: italic; opacity: 0.9; }
        
        #chat { 
            height: 450px;
            overflow-y: auto; 
            background: rgba(15, 52, 96, 0.4);
            padding: 20px; 
            border-radius: 20px; 
            margin-bottom: 20px; 
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }
        
        /* Estilo das Mensagens */
        .msg {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 1rem;
            line-height: 1.5;
            position: relative;
            animation: slideIn 0.3s ease-out forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user {
            background: #4834d4;
            align-self: flex-end;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot {
            background: #686de0;
            align-self: flex-start;
            color: white;
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .bot-message-wrapper { display: flex; align-items: flex-start; gap: 10px; }
        .bot-icon { width: 30px; height: 30px; border-radius: 50%; margin-top: 4px; }
        
        .bot-image {
            margin-top: 15px;
            max-width: 100%;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.3s;
            display: block;
        }
        .bot-image:hover { transform: scale(1.02); }

        .google-arts-btn {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 18px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid #ffd700;
            color: #ffd700;
            text-decoration: none;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: bold;
            transition: 0.3s;
        }
        .google-arts-btn:hover { background: #ffd700; color: #1a1a2e; }

        .input-area { display: flex; gap: 10px; }
        
        input {
            flex: 1;
            padding: 15px 25px;
            border: 2px solid #e94560;
            border-radius: 30px;
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: #ffd700; background: rgba(255,255,255,0.1); }

        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 0 30px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #ff4d6d; transform: scale(1.05); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .loading { font-style: italic; opacity: 0.8; font-size: 0.9rem; }

        /* Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center;
        }
        .modal img { max-width: 90%; max-height: 85%; border-radius: 10px; }

        #chat::-webkit-scrollbar { width: 6px; }
        #chat::-webkit-scrollbar-thumb { background: #e94560; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="https://i.imgur.com/fnMYS0Z.png" alt="Candinho" class="avatar">
        <div class="title">
            <h1>Candinho</h1>
            <small>Seu amigo artista 🎨</small>
        </div>
    </div>

    <div id="chat"></div>

    <div class="input-area">
        <input type="text" id="pergunta" placeholder="Pergunte sobre um artista..." autocomplete="off">
        <button id="sendBtn">Enviar</button>
    </div>
</div>

<div id="imgModal" class="modal" onclick="this.style.display='none'">
    <img id="modalImg" src="">
</div>

<script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("pergunta");
    const btn = document.getElementById("sendBtn");
    let isProcessing = false;

    function appendMessage(text, side, extra = null) {
        const msgDiv = document.createElement("div");
        msgDiv.className = `msg ${side}`;

        if (side === 'bot') {
            const wrapper = document.createElement("div");
            wrapper.className = "bot-message-wrapper";
            wrapper.innerHTML = `
                <img src="https://i.imgur.com/UDl1c5j.png" class="bot-icon">
                <span class="bot-text">${text}</span>
            `;
            msgDiv.appendChild(wrapper);

            // Se houver imagem (Wikimedia)
            if (extra && extra.image) {
                const img = document.createElement("img");
                img.src = extra.image.imagemUrl;
                img.className = "bot-image";
                img.onclick = () => {
                    document.getElementById("modalImg").src = img.src;
                    document.getElementById("imgModal").style.display = "flex";
                };
                msgDiv.appendChild(img);
                
                const credit = document.createElement("div");
                credit.style.fontSize = "0.6rem"; credit.style.marginTop = "5px";
                credit.innerText = `📷 ${extra.image.credito || 'Fonte Aberta'}`;
                msgDiv.appendChild(credit);
            }

            // Se houver Link Google Arts
            if (extra && extra.googleArts) {
                const link = document.createElement("a");
                link.href = extra.googleArts.url;
                link.target = "_blank";
                link.className = "google-arts-btn";
                link.innerText = "✨ Galeria no Google Arts & Culture";
                msgDiv.appendChild(link);
            }
        } else {
            msgDiv.innerText = text;
        }

        chat.appendChild(msgDiv);
        chat.scrollTop = chat.scrollHeight;
    }

    async function handleSend() {
        const val = input.value.trim();
        if (!val || isProcessing) return;

        try {
            isProcessing = true;
            btn.disabled = true;
            input.disabled = true;

            appendMessage(val, 'user');
            input.value = "";

            // Loading
            const loading = document.createElement("div");
            loading.className = "msg bot loading";
            loading.id = "loader";
            loading.innerText = "Candinho está pensando...";
            chat.appendChild(loading);
            chat.scrollTop = chat.scrollHeight;

            const res = await fetch("/api/groq", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ mensagem: val })
            });

            if (!res.ok) throw new Error();

            const data = await res.json();
            document.getElementById("loader").remove();

            appendMessage(data.reply, 'bot', { image: data.image, googleArts: data.googleArts });

        } catch (e) {
            if(document.getElementById("loader")) document.getElementById("loader").remove();
            appendMessage("Ops! Minha paleta bagunçou. Pode repetir? 🎨", "bot");
        } finally {
            isProcessing = false;
            btn.disabled = false;
            input.disabled = false;
            input.focus();
        }
    }

    btn.addEventListener("click", handleSend);
    input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") handleSend();
    });

    // Saudação inicial
    window.onload = () => {
        appendMessage("Olá! Sou o Candinho, seu amigo artista. O que vamos descobrir hoje? 🎨", "bot");
        input.focus();
    };
</script>

</body>
</html>
