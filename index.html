<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Candinho</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #ffeaa7, #81ecec);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
    }
    .container {
        max-width: 800px;
        width: 100%;
        background: white;
        border-radius: 35px;
        box-shadow: 0 20px 35px rgba(0,0,0,0.2);
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }
    .header {
        background: #6c5ce7;
        color: white;
        padding: 20px;
        text-align: center;
    }
    .avatar {
        width: 80px;
        border-radius: 50%;
        border: 3px solid #f9b713;
        margin-bottom: 10px;
    }
    .header h2 { margin: 0; font-size: 1.6rem; }
    #chat {
        height: 400px;
        overflow-y: auto;
        background: #f8f9fa;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .msg {
        max-width: 80%;
        padding: 10px 15px;
        border-radius: 20px;
        line-height: 1.4;
        word-wrap: break-word;
    }
    .user {
        background: #74b9ff;
        align-self: flex-end;
        color: #000;
        border-bottom-right-radius: 5px;
    }
    .bot {
        background: #55efc4;
        align-self: flex-start;
        border-bottom-left-radius: 5px;
    }
    .loading {
        background: #dfe6e9;
        font-style: italic;
        animation: pulse 1s infinite;
    }
    @keyframes pulse { 0% { opacity: 0.6; } 100% { opacity: 1; } }
    .input-area {
        display: flex;
        padding: 15px;
        background: white;
        border-top: 1px solid #ddd;
        gap: 10px;
    }
    input {
        flex: 1;
        padding: 12px 18px;
        border: 2px solid #6c5ce7;
        border-radius: 50px;
        font-size: 1rem;
        outline: none;
    }
    button {
        background: #fd79a8;
        border: none;
        padding: 0 20px;
        border-radius: 50px;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .image-msg {
        display: flex;
        flex-direction: column;
        gap: 5px;
    }
    .image-msg img {
        max-width: 200px;
        border-radius: 10px;
        margin-top: 5px;
    }
    .image-caption {
        font-size: 0.7rem;
        color: #666;
    }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <img src="https://i.imgur.com/fnMYS0Z.png" alt="Candinho" class="avatar">
        <h2>Candinho</h2>
    </div>
    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="pergunta" placeholder="Ex: Quem foi Tarsila do Amaral?" autocomplete="off">
        <button id="sendBtn">Enviar</button>
    </div>
</div>

<script>
    // ======================= DOM =======================
    const chatDiv = document.getElementById("chat");
    const inputField = document.getElementById("pergunta");
    const sendBtn = document.getElementById("sendBtn");

    // ======================= MEMÓRIA (contexto) =======================
    let ultimoArtista = null;
    let memoria = {
        nome: localStorage.getItem("candinho_nome") || "",
        idade: localStorage.getItem("candinho_idade") || "",
        ultimoArtista: null
    };

    // ======================= FUNÇÕES UI =======================
    function addMessageToUI(text, isUser) {
        const div = document.createElement("div");
        div.className = `msg ${isUser ? "user" : "bot"}`;
        div.innerText = text;
        chatDiv.appendChild(div);
        chatDiv.scrollTop = chatDiv.scrollHeight;
        return div;
    }

    function addImageToUI(imageUrl, titulo, credito) {
        const div = document.createElement("div");
        div.className = "msg bot image-msg";
        div.innerHTML = `
            <div>🖼️ <strong>${titulo}</strong></div>
            <img src="${imageUrl}" alt="${titulo}">
            <div class="image-caption">📷 Fonte: ${credito}</div>
        `;
        chatDiv.appendChild(div);
        chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    function addLoading() {
        const div = document.createElement("div");
        div.className = "msg bot loading";
        div.id = "loadingMsg";
        div.innerText = "Candinho está pensando... 🖌️";
        chatDiv.appendChild(div);
        chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    function removeLoading() {
        const el = document.getElementById("loadingMsg");
        if (el) el.remove();
    }

    // ======================= CHAMADA AO BACK-END =======================
    async function enviarParaBackend(mensagem) {
        try {
            const resposta = await fetch('/api/groq', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    mensagem: mensagem,
                    memoria: {
                        ...memoria,
                        ultimoArtista: ultimoArtista
                    }
                })
            });
            const dados = await resposta.json();
            
            // Atualiza o último artista com o que o back-end retornou
            if (dados.artista) ultimoArtista = dados.artista;
            
            // Se veio imagem, exibe
            if (dados.image && dados.image.imagemUrl) {
                addImageToUI(dados.image.imagemUrl, dados.image.titulo, dados.image.credito);
            }
            
            // Se veio lista de obras, exibe as primeiras (opcional)
            if (dados.artworks && dados.artworks.length > 0) {
                dados.artworks.slice(0, 2).forEach(obra => {
                    if (obra.imagem) {
                        addImageToUI(obra.imagem, obra.titulo, "Europeana");
                    }
                });
            }
            
            return dados.reply;
        } catch (erro) {
            console.error("Erro no back-end:", erro);
            return "Puxa, tive um probleminha técnico. Tente de novo? 🎨";
        }
    }

    // ======================= FUNÇÃO RESPONDER =======================
    async function responder(pergunta) {
        // Se for saudação simples, responde direto sem chamar back-end
        const perguntaLow = pergunta.toLowerCase();
        if (perguntaLow === "oi" || perguntaLow === "olá" || perguntaLow === "hello") {
            return "Olá! Sou o Candinho, seu amigo artista. Pergunte sobre Tarsila, Portinari, Van Gogh... 🎨";
        }
        if (perguntaLow.includes("obrigado")) {
            return "Por nada! Fico feliz em ajudar. 🦆💛";
        }
        
        // Para qualquer outra pergunta, chama o back-end
        return await enviarParaBackend(pergunta);
    }

    // ======================= ENVIO DE MENSAGEM =======================
    let isProcessing = false;
    async function enviar() {
        if (isProcessing) return;
        const texto = inputField.value.trim();
        if (!texto) return;
        isProcessing = true;
        sendBtn.disabled = true;
        inputField.disabled = true;
        
        addMessageToUI(texto, true);
        inputField.value = "";
        addLoading();
        
        try {
            const resposta = await responder(texto);
            removeLoading();
            addMessageToUI(resposta, false);
        } catch (err) {
            removeLoading();
            addMessageToUI("Ops! Ocorreu um erro inesperado.", false);
            console.error(err);
        } finally {
            isProcessing = false;
            sendBtn.disabled = false;
            inputField.disabled = false;
            inputField.focus();
        }
    }

    sendBtn.addEventListener("click", enviar);
    inputField.addEventListener("keypress", (e) => { if (e.key === "Enter" && !isProcessing) enviar(); });

    // Mensagem inicial
    addMessageToUI("Olá! Sou o Candinho, seu amigo artista. 🎨", false);
</script>
</body>
</html>
