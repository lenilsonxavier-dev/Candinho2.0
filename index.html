```html
<script>
    const chatDiv = document.getElementById("chat");
    const inputField = document.getElementById("pergunta");
    const sendBtn = document.getElementById("sendBtn");
    
    let ultimoArtista = null;
    let memoria = {
        nome: localStorage.getItem("candinho_nome") || "",
        idade: localStorage.getItem("candinho_idade") || "",
        ultimoArtista: null
    };

    // ========================================
    // FUNÇÕES DO MODAL DE ZOOM
    // ========================================
    function openImageModal(imgSrc, caption) {
        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("modalImage");
        const modalCaption = document.getElementById("modalCaption");
        
        modalImg.src = imgSrc;
        modalCaption.innerText = caption || "Obra de arte";
        modal.style.display = "flex";
        
        // Previne scroll do body quando modal está aberto
        document.body.style.overflow = "hidden";
    }
    
    function closeImageModal() {
        const modal = document.getElementById("imageModal");
        modal.style.display = "none";
        document.body.style.overflow = "";
    }
    
    // Fechar modal com tecla ESC
    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
            closeImageModal();
        }
    });

    // ========================================
    // FUNÇÃO DE MENSAGENS (ATUALIZADA)
    // ========================================
    function addMessageToUI(text, isUser, imageData = null) {
        const div = document.createElement("div");
        div.className = `msg ${isUser ? "user" : "bot"}`;
        
        // Texto principal
        const textSpan = document.createElement("span");
        textSpan.style.whiteSpace = "pre-wrap";

        // Usuário = texto puro
        // Bot = permite HTML (para imagem do Candinho na saudação)
        if (isUser) {
            textSpan.innerText = text;
        } else {
            textSpan.innerHTML = text;
        }

        div.appendChild(textSpan);
        
        // Adiciona imagem se houver dados disponíveis
        if (imageData && imageData.imagemUrl) {
            const imgContainer = document.createElement("div");
            imgContainer.style.marginTop = "10px";
            
            const img = document.createElement("img");
            img.src = imageData.imagemUrl;
            img.alt = imageData.titulo || "Imagem da obra";
            img.className = "bot-image";
            img.loading = "lazy";
            img.title = "Clique para ampliar";
            
            img.addEventListener("click", (e) => {
                e.stopPropagation();
                const highResUrl = imageData.imagemGrande || imageData.imagemUrl;

                openImageModal(
                    highResUrl,
                    imageData.titulo ||
                    `Obra de ${imageData.credito || "artista"}`
                );
            });
            
            imgContainer.appendChild(img);
            
            const creditSpan = document.createElement("div");
            creditSpan.className = "image-credit";
            creditSpan.innerText =
                `📷 ${imageData.credito || "Europeana"} • Clique na imagem para ampliar`;

            imgContainer.appendChild(creditSpan);
            div.appendChild(imgContainer);
        }
        
        chatDiv.appendChild(div);
        chatDiv.scrollTop = chatDiv.scrollHeight;
        return div;
    }

    function addLoading() {
        const div = document.createElement("div");
        div.className = "msg bot loading";
        div.id = "loadingMsg";
        div.innerText = "Candinho está pensando... 🎨";
        chatDiv.appendChild(div);
        chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    function removeLoading() {
        const el = document.getElementById("loadingMsg");
        if (el) el.remove();
    }

    async function enviarParaBackend(mensagem) {
        try {
            const response = await fetch('/api/groq', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    mensagem: mensagem,
                    memoria: {
                        ...memoria,
                        ultimoArtista: ultimoArtista
                    }
                })
            });

            if (!response.ok) {
                throw new Error(
                    `Erro na resposta do servidor: ${response.status}`
                );
            }

            const data = await response.json();
            
            if (data.artista) {
                ultimoArtista = data.artista;
                memoria.ultimoArtista = ultimoArtista;
            }
            
            let textoFormatado =
                data.reply ||
                "Acho que me distraí com uma pintura! Pode repetir? 🎨";
            
            return {
                texto: textoFormatado,
                imagem: data.image || null
            };

        } catch (error) {
            console.error(
                "Erro na comunicação com o back-end:",
                error
            );

            return {
                texto:
                    "Puxa, derramei minhas tintas! Tente me perguntar de novo? 🎨",
                imagem: null
            };
        }
    }

    let isProcessing = false;

    async function enviar() {
        const pergunta = inputField.value.trim();

        if (!pergunta || isProcessing) return;
        
        isProcessing = true;
        sendBtn.disabled = true;
        inputField.disabled = true;
        
        addMessageToUI(pergunta, true);
        inputField.value = "";
        
        addLoading();
        
        const resposta = await enviarParaBackend(pergunta);

        removeLoading();
        
        addMessageToUI(
            resposta.texto,
            false,
            resposta.imagem
        );
        
        isProcessing = false;
        sendBtn.disabled = false;
        inputField.disabled = false;
        inputField.focus();
    }

    sendBtn.addEventListener("click", enviar);

    inputField.addEventListener("keypress", (e) => { 
        if (e.key === "Enter") {
            e.preventDefault();
            enviar(); 
        }
    });

    // ========================================
    // SAUDAÇÃO COM ÍCONE NO TEXTO
    // (SEM ALTERAR O AVATAR DO TOPO)
    // ========================================
    const iconeCandinho = `
        <img 
            src="https://i.imgur.com/UDl1c5j.png"
            alt="Candinho"
            style="
                width:32px;
                height:32px;
                vertical-align:middle;
                margin-left:6px;
                border-radius:50%;
            "
        >
    `;

    const saudacaoInicial = memoria.nome
        ? `Olá, ${memoria.nome}! Sou o Candinho, seu amigo artista. ${iconeCandinho}`
        : `Olá! Sou o Candinho, seu amigo artista. ${iconeCandinho}`;

    addMessageToUI(saudacaoInicial, false);
</script>
```
